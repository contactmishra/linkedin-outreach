<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Outreach Desk</title>
<style>
/* Layout: a three-pane desk that fills the window (sidebar · list · inspector), pipeline strip on top.
   Colour carries meaning: each stage has its own system colour; each row's tint shows what you did to it. */
:root{
  color-scheme:light;
  --canvas:#FFFFFF; --side:#F5F5F7; --surface:#FFFFFF; --raised:#FFFFFF; --sunk:#F5F5F7;
  --fill:rgba(118,118,128,.08); --fill-2:rgba(118,118,128,.15);
  --line:rgba(60,60,67,.12); --line-2:rgba(60,60,67,.22);
  --fg:#1D1D1F; --fg-2:#5E5E63; --fg-3:#8A8A8F;
  --tint:#007AFF; --tint-soft:rgba(0,122,255,.10); --tint-ink:#0062CC;
  --ok:#34C759; --ok-ink:#1D7A34; --ok-soft:rgba(52,199,89,.13); --ok-line:rgba(52,199,89,.45);
  --warn:#FF9500; --warn-ink:#A55B00; --warn-soft:rgba(255,149,0,.13);
  --bad:#FF3B30; --bad-ink:#C4271D; --bad-soft:rgba(255,59,48,.10);
  --edit-soft:rgba(0,122,255,.07); --edit-line:rgba(0,122,255,.35);
  --s-found:#8E8E93; --s-requested:#007AFF; --s-accepted:#FF9500; --s-thanked:#30B0C7; --s-cv_sent:#5856D6;
  --s-followed_up:#AF52DE; --s-replied:#34C759; --s-done:#A2845E; --s-stale:#FF3B30; --s-blacklisted:#636366;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 3px 12px rgba(0,0,0,.05);
  --shadow-lg:0 18px 50px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.08);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px; --r-sm:8px; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --canvas:#161617; --side:#1E1E20; --surface:#1C1C1E; --raised:#2C2C2E; --sunk:#232325;
  --fill:rgba(118,118,128,.18); --fill-2:rgba(118,118,128,.30);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.17);
  --fg:#F5F5F7; --fg-2:#AEAEB2; --fg-3:#8A8A8F;
  --tint:#0A84FF; --tint-soft:rgba(10,132,255,.18); --tint-ink:#64B0FF;
  --ok:#30D158; --ok-ink:#4CD964; --ok-soft:rgba(48,209,88,.16); --ok-line:rgba(48,209,88,.5);
  --warn:#FF9F0A; --warn-ink:#FFB340; --warn-soft:rgba(255,159,10,.16);
  --bad:#FF453A; --bad-ink:#FF6961; --bad-soft:rgba(255,69,58,.15);
  --edit-soft:rgba(10,132,255,.12); --edit-line:rgba(10,132,255,.45);
  --s-found:#98989D; --s-requested:#0A84FF; --s-accepted:#FF9F0A; --s-thanked:#40C8E0; --s-cv_sent:#5E5CE6;
  --s-followed_up:#BF5AF2; --s-replied:#30D158; --s-done:#AC8E68; --s-stale:#FF453A; --s-blacklisted:#8E8E93;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 3px 12px rgba(0,0,0,.25);
  --shadow-lg:0 18px 50px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--fg);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid color-mix(in srgb,var(--tint) 45%,transparent);outline-offset:1px;border-radius:8px}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- app shell ---------- */
.app{height:100vh;display:grid;grid-template-columns:236px minmax(0,1fr)}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;min-height:0;overflow-y:auto;padding:18px 10px 14px}
.main{display:grid;grid-template-rows:auto auto minmax(0,1fr);min-width:0;min-height:0}

/* sidebar */
.brand{padding:0 8px;display:grid;gap:2px}
.brand b{font:700 17px/1.2 var(--display);letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--fg-3)}
.brand .note{font-size:11.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.navsec{display:grid;gap:1px}
.navsec h3{margin:0 0 4px;padding:0 8px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.nav{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;border-radius:8px;padding:5px 8px;text-align:left;color:var(--fg);font-size:13.5px;transition:background-color .12s var(--ease)}
.nav:hover{background:var(--fill)}
.nav:active{transform:scale(.985)}
.nav[aria-current="true"]{background:var(--fill-2);font-weight:600}
.nav .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .cnt{font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.nav .cnt.hot{background:var(--warn);color:#fff;border-radius:999px;padding:0 7px;font-weight:600}
.nav .cnt.ok{background:var(--ok);color:#fff;border-radius:999px;padding:0 7px;font-weight:600}
.nav .cnt.bad{background:var(--bad);color:#fff;border-radius:999px;padding:0 7px;font-weight:600}
.nav svg.i{color:var(--tint)}
.nav.dim{opacity:.5}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--fg-3));flex:none}
.sidefoot{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--fg-3);display:grid;gap:3px}
.sidefoot b{color:var(--fg-2);font-weight:600}
.keyhint{margin-bottom:6px;color:var(--fg-3)}.keyhint kbd{font-size:10.5px;padding:0 4px}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:12px;padding:14px 20px 12px;min-width:0;flex-wrap:wrap}
.vt{min-width:0;flex:1 1 280px}
.vt h1{margin:0;font:700 22px/1.15 var(--display);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vt p{margin:2px 0 0;font-size:12.5px;color:var(--fg-2)}
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:9px;padding:6px 10px;width:240px;max-width:100%;color:var(--fg-3)}
.search input{border:0;background:transparent;outline:0;width:100%;color:var(--fg);font-size:13.5px}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:4px 10px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--raised);border-radius:8px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--fg);transition:background-color .15s var(--ease),transform .1s var(--ease),border-color .15s var(--ease);white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.primary{background:var(--tint);border-color:var(--tint);color:#fff}
.btn.primary:hover{background:color-mix(in srgb,var(--tint) 88%,#000)}
.btn.go{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.approved{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--tint)}
.btn.ghost:hover{background:var(--tint-soft)}
.btn.danger{color:var(--bad-ink)}
.btn.small{padding:3px 9px;font-size:12px}

/* run changes */
.run{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:7px 15px;font-weight:600;font-size:13px;background:var(--fill-2);color:var(--fg-2);transition:transform .1s var(--ease),background-color .2s var(--ease)}
.run:active{transform:scale(.97)}
.run .d{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.7}
.run.ready{background:var(--ok);color:#fff}
.run.ready .d{opacity:1;background:#fff}
.run.waiting{background:var(--warn-soft);color:var(--warn-ink)}
.run.running{background:var(--tint-soft);color:var(--tint-ink)}
@media (prefers-reduced-motion:no-preference){
  .run.ready{animation:glow 2.2s ease-in-out infinite}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 50%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--ok) 0%,transparent),0 0 20px 2px color-mix(in srgb,var(--ok) 40%,transparent)}}
  .run.running .d{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:.25}}
}
@media (prefers-reduced-motion:reduce){.run.ready{box-shadow:0 0 0 3px var(--ok-soft)}}

/* overview strip */
.overview{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center;padding:4px 20px 16px;border-bottom:1px solid var(--line)}
.segbar{display:flex;gap:3px;height:14px;border-radius:7px;overflow:hidden;background:var(--fill)}
.segbar i{display:block;height:100%;background:var(--c);min-width:4px;transition:flex-grow .4s var(--ease)}
.legend{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:10px}
.lg{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;border-radius:8px;padding:4px 8px 4px 6px;font-size:12.5px;color:var(--fg-2)}
.lg:hover{background:var(--fill)}
.lg b{color:var(--fg);font-weight:600}
.lg.zero{opacity:.45}
.lg[aria-pressed="true"]{background:var(--fill-2);color:var(--fg)}
.kpis{display:flex;gap:10px}
.kpi{background:var(--sunk);border-radius:var(--r);padding:9px 14px;min-width:118px;display:grid;gap:1px}
.kpi span{font-size:11.5px;color:var(--fg-2)}
.kpi b{font:600 20px/1.2 var(--display);letter-spacing:-.01em}
.kpi b small{font-size:13px;color:var(--fg-3);font-weight:500}
.kpi em{font-style:normal;font-size:11.5px;color:var(--fg-3)}
.kpi .meter{height:5px;border-radius:3px;background:var(--fill-2);overflow:hidden;margin-top:4px}
.kpi .meter i{display:block;height:100%;background:var(--ok);border-radius:3px}
.kpi.warn .meter i{background:var(--warn)} .kpi.bad .meter i{background:var(--bad)}
.kpi.bad b{color:var(--bad-ink)} .kpi.warn b{color:var(--warn-ink)}

/* work area */
.work{display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
.work.withinsp{grid-template-columns:minmax(0,1fr) minmax(380px,34%)}
.work.boardmode{grid-template-columns:minmax(0,1fr)}
.listpane{min-height:0;overflow-y:auto;container-type:inline-size;background:var(--canvas)}
.inspector{border-left:1px solid var(--line);min-height:0;overflow-y:auto;background:var(--surface)}
.boardpane{min-height:0;overflow:auto;padding:14px 20px 20px}

/* bulk bar */
.bulk{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:14px;padding:10px 20px;background:color-mix(in srgb,var(--canvas) 88%,transparent);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);border-bottom:1px solid var(--line);flex-wrap:wrap}
.bulk .txt{font-size:13px;color:var(--fg-2)}
.bulk .txt b{color:var(--fg)}
.prog{flex:1;min-width:120px;max-width:340px;height:6px;border-radius:3px;background:var(--fill-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .35s var(--ease)}
.bulk .sp{flex:1}

/* rows */
.rows{padding:6px 12px 24px}
.row{display:grid;grid-template-columns:30px minmax(0,2.3fr) minmax(0,1.3fr) 118px minmax(0,1.5fr) auto;gap:12px;align-items:center;padding:9px 12px 9px 10px;border-radius:10px;border:1px solid transparent;position:relative;cursor:default;transition:background-color .2s var(--ease),border-color .2s var(--ease)}
.row+.row{margin-top:2px}
.row:hover{background:var(--fill)}
.row::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--c)}
.row.sel{background:var(--fill);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--tint) 70%,transparent)}
.who{min-width:0}
.who b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{display:block;font-size:12.5px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co{min-width:0;font-size:13px}
.co span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co span+span{font-size:12px;color:var(--fg-3)}
.stg{display:flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}
.nx{min-width:0;font-size:13px}
.nx span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nx .when{font-size:12px;color:var(--fg-3)}
.nx .when.late{color:var(--bad-ink)}
.act{display:flex;justify-content:flex-end;gap:6px;min-width:92px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#fff;background:var(--c);letter-spacing:.02em;flex:none}
@container (max-width:820px){.row{grid-template-columns:30px minmax(0,2.3fr) 110px minmax(0,1.4fr) auto}.row .co{display:none}}
@container (max-width:600px){.row{grid-template-columns:30px minmax(0,1fr) auto}.row .stg,.row .nx{display:none}}

/* state tints: what you did to this person */
.st-approved{background:var(--ok-soft)!important;border-color:var(--ok-line)!important}
.st-edited{background:var(--edit-soft)!important;border-color:var(--edit-line)!important}
.st-sent{background:var(--sunk)!important}
.st-sent .who b,.st-sent .who span{color:var(--fg-3)}
.st-queued{background:var(--bad-soft)!important;border-color:color-mix(in srgb,var(--bad) 40%,transparent)!important}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.need{background:var(--warn-soft);color:var(--warn-ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok-ink)}
.chip.edit{background:var(--tint-soft);color:var(--tint-ink)}
.chip.sent{background:var(--fill-2);color:var(--fg-2)}
.chip.bad{background:var(--bad-soft);color:var(--bad-ink)}
.chip svg.i{width:13px;height:13px;stroke-width:2.2}

/* review cards */
.cards{padding:14px 20px 28px;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px;align-items:start}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 12px 12px 15px;display:grid;gap:8px;position:relative;transition:background-color .25s var(--ease),border-color .25s var(--ease),box-shadow .2s var(--ease)}
.rcard::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--c)}
.rcard.sel{box-shadow:0 0 0 2px color-mix(in srgb,var(--tint) 55%,transparent),var(--shadow)}
.rhead{display:flex;align-items:center;gap:10px;min-width:0}
.rhead .who{flex:1}
.cp{font-size:12.5px;color:var(--fg-2);background:var(--fill);border-radius:8px;padding:6px 10px}
.cp b{font-weight:600;color:var(--fg-2);margin-right:4px}
.common{font-size:12.5px;color:var(--fg-2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.common b{font-weight:600;color:var(--fg)}
.rhead .x{width:26px;height:26px}
.dr{display:grid;gap:6px}
.drh{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--fg-3);font-weight:600}
.drh .lab{text-transform:uppercase;letter-spacing:.06em}
.drh em{font-style:normal;font-weight:400;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:transparent;color:var(--fg-3);border-radius:7px;width:28px;height:26px;display:grid;place-items:center}
.iconbtn:hover{background:var(--fill);color:var(--fg)}
.iconbtn:active{transform:scale(.94)}
textarea.msg{width:100%;resize:none;border:1px solid var(--line);border-radius:10px;background:var(--canvas);padding:8px 10px;line-height:1.45;font-size:13.5px;min-height:56px;overflow:hidden;transition:border-color .15s var(--ease),background-color .25s var(--ease)}
textarea.msg:focus{outline:0;border-color:var(--tint);box-shadow:0 0 0 3px var(--tint-soft)}
.st-approved textarea.msg{background:color-mix(in srgb,var(--surface) 70%,transparent);border-color:var(--ok-line)}
.dra{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.dra .sp{flex:1;font-size:12px;color:var(--fg-3)}

/* inspector */
.insp{padding:20px 22px 40px;display:grid;gap:18px;align-content:start}
.ihead{display:flex;gap:14px;align-items:flex-start}
.ihead .avatar{width:48px;height:48px;font-size:16px}
.ihead h2{margin:0;font:700 20px/1.2 var(--display);letter-spacing:-.015em}
.ihead p{margin:3px 0 0;font-size:13px;color:var(--fg-2)}
.ihead .x{margin-left:auto}
.x{border:0;background:var(--fill);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;color:var(--fg-2);flex:none}
.x:hover{background:var(--fill-2)}
.ilinks{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ilinks a{display:inline-flex;align-items:center;gap:5px;color:var(--tint);text-decoration:none;font-size:13px;font-weight:500}
.ilinks a:hover{text-decoration:underline}
.journey{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0}
.journey li{display:grid;gap:4px;justify-items:center;text-align:center;position:relative;font-size:11.5px;color:var(--fg-3)}
.journey li::before{content:"";position:absolute;top:6px;left:-50%;right:50%;height:2px;background:var(--fill-2)}
.journey li:first-child::before{display:none}
.journey li.on::before{background:var(--c)}
.journey i{width:14px;height:14px;border-radius:50%;border:2px solid var(--fill-2);background:var(--surface);position:relative;z-index:1}
.journey li.on i{background:var(--c);border-color:var(--c)}
.journey li.cur i{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.journey li.on span{color:var(--fg);font-weight:600}
.journey em{font-style:normal;font-size:11px}
.sec{display:grid;gap:8px}
.sec>h3{margin:0;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3)}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 16px;font-size:13px;margin:0}
.facts dt{color:var(--fg-3)}.facts dd{margin:0;overflow-wrap:anywhere}
.dbox{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;transition:background-color .25s var(--ease),border-color .25s var(--ease)}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
select.sel{border:1px solid var(--line-2);background:var(--raised);border-radius:8px;padding:5px 8px;font-size:13px}
textarea.notes{width:100%;min-height:70px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--canvas);padding:9px 11px;font-size:13.5px;line-height:1.5}
.hist{display:grid;gap:6px;font-size:12.5px;color:var(--fg-2);border-left:2px solid var(--fill-2);padding-left:12px}
.hist b{color:var(--fg);font-weight:500}
.empty-i{height:100%;display:grid;place-items:center;text-align:center;padding:40px;color:var(--fg-3)}
.empty-i h2{margin:0 0 6px;font:600 17px var(--display);color:var(--fg-2)}
.keys{display:grid;grid-template-columns:auto auto;gap:6px 12px;justify-content:center;margin-top:18px;font-size:12.5px;text-align:left}
kbd{font-family:var(--font);font-size:11.5px;background:var(--fill);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--fg-2)}

/* board */
.board{display:flex;gap:10px;height:100%;min-height:420px}
.board .col{flex:1 1 210px;min-width:190px}
.board .col.empty{flex:0 0 128px;min-width:128px}
.board .col.empty .colb{place-content:center;text-align:center;color:var(--fg-3);font-size:12px}
.col{background:var(--sunk);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;border:2px solid transparent;transition:border-color .15s var(--ease),background-color .15s var(--ease)}
.col.over{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--sunk))}
.colh{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;font-size:13px;font-weight:600}
.colh .n{margin-left:auto;font-size:12px;color:var(--fg-3);font-weight:500}
.colh::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.colb{padding:0 8px 10px;display:grid;gap:6px;align-content:start;overflow-y:auto;min-height:0;flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:grid;gap:2px;text-align:left;width:100%;cursor:grab;box-shadow:0 1px 1px rgba(0,0,0,.03);transition:background-color .2s var(--ease),transform .1s var(--ease)}
.card:active{cursor:grabbing}
.card.dragging{opacity:.4}
.card.sel{box-shadow:0 0 0 2px color-mix(in srgb,var(--tint) 55%,transparent)}
.card b{font-size:13px;font-weight:600}
.card span{font-size:12px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .late{color:var(--bad-ink)}
.col.blk .colb{place-content:center;text-align:center;color:var(--fg-3);font-size:12.5px;padding:16px}

/* sheet (inspector as overlay on board / narrow screens) */
.sheet{position:fixed;top:12px;right:12px;bottom:12px;width:min(440px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);z-index:20;overflow-y:auto}
@media (prefers-reduced-motion:no-preference){.sheet{animation:sheetIn .32s var(--ease)}@keyframes sheetIn{from{transform:translateX(24px);opacity:0}}}

/* dialogs */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:30}
.dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(540px,calc(100% - 32px));max-height:calc(100% - 48px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:22px;z-index:31;display:grid;gap:14px}
@media (prefers-reduced-motion:no-preference){.dialog{animation:dlgIn .22s var(--ease)}@keyframes dlgIn{from{opacity:0;transform:translate(-50%,-48%) scale(.98)}}}
.dialog h2{margin:0;font:700 18px var(--display);letter-spacing:-.01em}
.dh{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dialog ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:13.5px}
.dialog .step{display:grid;gap:4px;font-size:13px}
.dialog .step span{color:var(--fg-2)}
.cmd{display:flex;gap:8px;align-items:center;background:var(--fill);border-radius:10px;padding:10px 12px;font-family:var(--mono);font-size:13px}
.cmd span{flex:1;min-width:0;overflow-wrap:anywhere}
.fld{display:grid;gap:4px;font-size:12px;color:var(--fg-2);min-width:0}
.fld input,.fld select{border:1px solid var(--line-2);background:var(--canvas);border-radius:8px;padding:7px 9px;font-size:14px;color:var(--fg);width:100%}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.banner{margin:10px 20px 0;border-radius:10px;padding:9px 14px;font-size:13px;background:var(--warn-soft);color:var(--warn-ink)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:#1D1D1F;color:#F5F5F7;padding:10px 12px 10px 16px;border-radius:12px;font-size:13px;box-shadow:var(--shadow-lg);z-index:40}
.toast button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:7px;padding:4px 10px;font-weight:600}
.emptylist{padding:60px 24px;text-align:center;color:var(--fg-3)}
.emptylist h2{margin:0 0 6px;font:600 17px var(--display);color:var(--fg-2)}

/* narrow screens */
@media (max-width:1180px){
  .work,.work.withinsp{grid-template-columns:minmax(0,1fr)}
  .inspector.docked{display:none}
  .overview{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);height:auto;min-height:100vh}
  .side{flex-direction:row;overflow-x:auto;gap:10px;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}
  .side .navsec{display:flex;gap:4px}.side .navsec h3,.brand,.sidefoot{display:none}
  .nav{white-space:nowrap;width:auto}
  .main{display:block}
  .listpane{overflow:visible}
  .kpis{flex-wrap:wrap}
  .cards{grid-template-columns:minmax(0,1fr);padding:12px}
  .toolbar{padding:12px}
  .search{width:100%}
}
@media (prefers-reduced-transparency:reduce){.bulk{background:var(--canvas);backdrop-filter:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Views"></aside>
  <main class="main">
    <header class="toolbar">
      <div class="vt"><h1 id="vTitle">Outreach Desk</h1><p id="vSub">Loading your pipeline…</p></div>
      <label class="search"><svg class="i" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg><input id="search" type="search" placeholder="Search" aria-label="Search people"></label>
      <div class="seg" role="group" aria-label="Layout">
        <button id="mList" aria-pressed="true" title="List"><svg class="i" viewBox="0 0 16 16"><path d="M5.5 4h8.5M5.5 8h8.5M5.5 12h8.5M2.2 4h.1M2.2 8h.1M2.2 12h.1"/></svg>List</button>
        <button id="mBoard" aria-pressed="false" title="Board"><svg class="i" viewBox="0 0 16 16"><rect x="2" y="2.5" width="3.4" height="11" rx="1"/><rect x="6.3" y="2.5" width="3.4" height="7" rx="1"/><rect x="10.6" y="2.5" width="3.4" height="9" rx="1"/></svg>Board</button>
      </div>
      <button class="btn" id="addBtn"><svg class="i" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>Add person</button>
      <button class="run" id="runBtn" title="Send what you approved"><i class="d"></i><span id="runLabel">Nothing to run</span></button>
    </header>
    <div>
      <div class="banner" id="banner" hidden></div>
      <section class="overview" id="overview" aria-label="Pipeline"></section>
    </div>
    <div class="work" id="work">
      <section class="listpane" id="listpane"></section>
      <section class="boardpane" id="boardpane" hidden></section>
      <aside class="inspector docked" id="inspector" aria-label="Person"></aside>
    </div>
  </main>
</div>
<aside class="sheet" id="sheet" hidden aria-label="Person"></aside>
<div class="scrim" id="scrim" hidden></div>
<div class="dialog" id="runModal" hidden role="dialog" aria-labelledby="runTitle"></div>
<form class="dialog" id="addModal" hidden role="dialog" aria-labelledby="addTitle" autocomplete="off">
  <div class="dh"><h2 id="addTitle">Add a person</h2><button type="button" class="x" id="addClose" aria-label="Close"><svg class="i" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
  <label class="fld">Name<input id="fName" required></label>
  <label class="fld">LinkedIn profile URL<input id="fUrl" type="url" placeholder="https://www.linkedin.com/in/…"></label>
  <label class="fld">Title / headline<input id="fHead"></label>
  <div class="frow"><label class="fld">Company<input id="fCo"></label><label class="fld">Country<input id="fCountry"></label></div>
  <div class="frow"><label class="fld">Group<select id="fGroup"><option value="peer">Peer</option><option value="lead">Team lead</option><option value="recruiter">Recruiter</option><option value="other">Other</option></select></label>
    <label class="fld">Status<select id="fStatus"><option value="found">To request</option><option value="requested">Request already sent</option><option value="accepted">Already connected</option></select></label></div>
  <div class="ctrl"><button class="btn primary" type="submit">Add to the desk</button><span class="fld" id="addMsg"></span></div>
</form>
<div class="toast" id="toast" hidden role="status"><span id="toastMsg"></span><button id="toastAct" hidden></button></div>

<script>
/* ---------- constants ---------- */
const STAGES=[["found","To request"],["requested","Requested"],["accepted","Accepted"],["thanked","Thanked"],["cv_sent","CV sent"],["followed_up","Followed up"],["replied","Replied"],["done","Done"],["stale","Stale"],["blacklisted","Blacklisted"]];
const LABEL=Object.fromEntries(STAGES);
const PIPE=["found","requested","accepted","thanked","cv_sent","followed_up","replied","done","stale"];
const JOURNEY=[["requested","Requested","requestedAt"],["accepted","Accepted","acceptedAt"],["thanked","Thanked","thankedAt"],["cv_sent","CV sent","cvSentAt"],["followed_up","Follow-up","followUpAt"],["replied","Replied","repliedAt"]];
const GROUPS={peer:"Peer",lead:"Team lead",recruiter:"Recruiter",other:"Other"};
const DK=["thanks","cv","followup"];
const DNAME={thanks:"Thank-you",cv:"CV message",followup:"Follow-up"};
const SENT_STATUS={thanks:["thanked","thankedAt"],cv:["cv_sent","cvSentAt"],followup:["followed_up","followUpAt"]};
const STAMP={accepted:"acceptedAt",thanked:"thankedAt",cv_sent:"cvSentAt",followed_up:"followUpAt",replied:"repliedAt",requested:"requestedAt"};
const DEFAULTS={cvDelayDays:3,followUpDays:7,closeDays:7,staleDays:21,weeklyCap:80,dailyCap:15};
const RUN_PROMPT="Run the Outreach Desk queue";
const day=864e5;
const ICONS={
  check:'<circle cx="8" cy="8" r="6.5"/><path d="M5.2 8.3l1.9 1.9 3.8-4.1"/>',
  tick:'<path d="M3.5 8.5l3 3 6-7"/>',
  send:'<path d="M14 2L2.5 6.8l4.7 2 2 4.7z"/><path d="M7.2 8.8L14 2"/>',
  clock:'<circle cx="8" cy="8" r="6.5"/><path d="M8 4.6V8l2.4 1.5"/>',
  bubble:'<path d="M3 3h10a1.2 1.2 0 011.2 1.2v6A1.2 1.2 0 0113 11.4H7.2L4 14v-2.6H3a1.2 1.2 0 01-1.2-1.2v-6A1.2 1.2 0 013 3z"/>',
  hourglass:'<path d="M4 2h8M4 14h8M5 2v1.6c0 1.6 3 2.9 3 4.4s-3 2.8-3 4.4V14M11 2v1.6c0 1.6-3 2.9-3 4.4s3 2.8 3 4.4V14"/>',
  people:'<circle cx="6" cy="5.4" r="2.5"/><path d="M1.6 13.6c.6-2.4 2.3-3.6 4.4-3.6s3.8 1.2 4.4 3.6"/><path d="M10.6 3.1a2.4 2.4 0 010 4.6M12.1 10.2c1.2.5 2 1.6 2.4 3.3"/>',
  block:'<circle cx="8" cy="8" r="6.5"/><path d="M3.4 12.6l9.2-9.2"/>',
  out:'<path d="M6.5 3.5H3.5v9h9v-3"/><path d="M9 2.5h4.5V7M13.5 2.5L7.5 8.5"/>',
  copy:'<rect x="5.2" y="5.2" width="8.3" height="8.3" rx="1.6"/><path d="M3 10.6V3.6A1.1 1.1 0 014.1 2.5h7"/>',
  x:'<path d="M4 4l8 8M12 4l-8 8"/>',
  globe:'<circle cx="8" cy="8" r="6.5"/><path d="M1.5 8h13M8 1.5c1.8 1.9 2.6 4 2.6 6.5S9.8 12.6 8 14.5C6.2 12.6 5.4 10.5 5.4 8S6.2 3.4 8 1.5z"/>'
};
const ic=(n,cls="i")=>`<svg class="${cls}" viewBox="0 0 16 16" aria-hidden="true">${ICONS[n]||""}</svg>`;

/* ---------- state ---------- */
let contacts=[], settings={...DEFAULTS}, meta={}, runReq={}, loaded=false;
let view=null, country="all", query="", selId=null, mode="list", inspOpen=false;
try{ view=localStorage.getItem("od-view")||null; mode=localStorage.getItem("od-mode")||"list"; country=localStorage.getItem("od-country")||"all"; }catch{}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const t=d=>d?new Date(d).getTime():NaN;
const fmt=d=>{const x=new Date(d);return isNaN(x)?"":x.toLocaleDateString(undefined,{day:"numeric",month:"short"});};
function rel(ms,past){ if(isNaN(ms)) return ""; const d=Math.round((ms-Date.now())/day);
  if(past) return d>=0?"today":(d===-1?"yesterday":`${-d} days ago`);
  return d===0?"today":d>0?`in ${d}d`:`${-d}d overdue`; }
const save=(k,v)=>{try{localStorage.setItem(k,v);}catch{}};
const initials=n=>String(n||"?").replace(/^dr\.?\s+/i,"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();

/* ---------- derived ---------- */
function stageOf(c){ if(c.status==="requested" && t(c.requestedAt)+settings.staleDays*day<Date.now()) return "stale"; return c.status||"found"; }
const drafts=c=>c.drafts||{};
const pendingKeys=c=>DK.filter(k=>drafts(c)[k] && !drafts(c)[k].sentAt && !drafts(c)[k].approved);
const approvedKeys=c=>DK.filter(k=>drafts(c)[k] && !drafts(c)[k].sentAt && drafts(c)[k].approved);
const openKeys=c=>DK.filter(k=>drafts(c)[k] && !drafts(c)[k].sentAt);
function recentlyDone(c){ const lim=Date.now()-day; return DK.some(k=>t(drafts(c)[k]?.sentAt)>lim) || t(c.withdrawnAt)>lim; }
function rowState(c){
  if(c.withdrawPending) return "queued";
  if(approvedKeys(c).length && !pendingKeys(c).length) return "approved";
  if(pendingKeys(c).some(k=>drafts(c)[k].editedByUser)) return "edited";
  if(recentlyDone(c)) return "sent";
  return "";
}
function stateChip(c){
  const s=rowState(c), p=pendingKeys(c).length;
  if(s==="queued") return `<span class="chip bad">Withdraw queued</span>`;
  if(s==="approved") return `<span class="chip ok">${ic("tick")}Approved</span>`;
  if(s==="edited") return `<span class="chip edit">Edited</span>`;
  if(p) return `<span class="chip need">Needs OK</span>`;
  if(s==="sent") return `<span class="chip sent">Sent</span>`;
  return "";
}
function nextStep(c){
  const s=settings, now=Date.now(), d=drafts(c);
  const draftStep=(k,label,due)=> d[k]&&!d[k].sentAt ? (d[k].approved?{text:`${label} queued for Claude`,due,passive:true,tone:"ok"}:{text:`Approve the ${label==="CV message"?label:label.toLowerCase()}`,due,tone:"warn"}) : {text:`${label} to write`,due,tone:"info"};
  switch(stageOf(c)){
    case "found": return {text:"Send connection request",due:now,tone:"info"};
    case "requested": return {text:"Waiting for acceptance",due:t(c.requestedAt)+s.staleDays*day,passive:true,tone:"idle"};
    case "stale": return c.withdrawPending?{text:"Withdrawal queued",passive:true,due:now,tone:"bad"}:{text:"Withdraw and blacklist",due:t(c.requestedAt)+s.staleDays*day,tone:"bad"};
    case "accepted": return draftStep("thanks","Thank-you",t(c.acceptedAt)||now);
    case "thanked": return draftStep("cv","CV message",t(c.thankedAt)+s.cvDelayDays*day);
    case "cv_sent": return d.followup&&!d.followup.sentAt?draftStep("followup","Follow-up",t(c.cvSentAt)+s.followUpDays*day):{text:"Follow up if no reply",due:t(c.cvSentAt)+s.followUpDays*day,tone:"info"};
    case "followed_up": return {text:"Close if no reply",due:t(c.followUpAt)+s.closeDays*day,tone:"idle"};
    case "replied": return {text:"Answer the reply",due:t(c.repliedAt)||now,tone:"ok",past:true};
    default: return null;
  }
}
const isDue=c=>{const n=nextStep(c); return n&&!n.passive&&n.due<=Date.now()+day;};
const VIEWS={
  needs:{title:"Review drafts",icon:"check",test:c=>c.status!=="blacklisted"&&openKeys(c).length>0,hint:"Approved ones turn green and stay in place"},
  ready:{title:"Ready to send",icon:"send",all:true,test:c=>(c.status!=="blacklisted"&&approvedKeys(c).length>0)||c.withdrawPending,hint:"Approved. Press Run changes to send"},
  due:{title:"Due",icon:"clock",test:isDue,hint:"Everything that needs doing today"},
  replies:{title:"Replies",icon:"bubble",test:c=>c.status==="replied",hint:"Answer these yourself"},
  stale:{title:"Stale invites",icon:"hourglass",test:c=>stageOf(c)==="stale"&&!c.withdrawPending,hint:"No answer for 21+ days"},
  all:{title:"Everyone",icon:"people",test:()=>true,hint:"All people on the desk"},
  blacklist:{title:"Blacklist",icon:"block",all:true,test:c=>c.status==="blacklisted",hint:"Never contacted again"}
};
function viewDef(v){ if(v&&v.startsWith("stage:")){const k=v.slice(6);return {title:LABEL[k]||k,stage:k,test:c=>stageOf(c)===k,hint:"Stage"};} return VIEWS[v]||VIEWS.all; }
const inCountry=c=>country==="all"||(c.country||"Unknown")===country;
function itemsFor(v){ const d=viewDef(v); return contacts.filter(c=>inCountry(c)&&(d.all||c.status!=="blacklisted")&&d.test(c)); }
function matches(c){ const q=query.trim().toLowerCase(); return !q||[c.name,c.company,c.headline,c.country].join(" ").toLowerCase().includes(q); }
const byDue=(a,b)=>((nextStep(a)?.due??Infinity)-(nextStep(b)?.due??Infinity))||String(a.name).localeCompare(b.name);
const byAccepted=(a,b)=>(t(b.acceptedAt)||0)-(t(a.acceptedAt)||0)||String(a.name).localeCompare(b.name);

/* ---------- render ---------- */
let pendingRender=false, visibleIds=[];
function typingIn(el){ const a=document.activeElement; return a && el && el.contains(a) && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName); }
function render(){
  if(!loaded) return;
  if(!view){ view = contacts.some(c=>pendingKeys(c).length)?"needs":(itemsFor("due").length?"due":"all"); }
  renderSide(); renderOverview(); renderToolbar(); renderRun();
  const busy = typingIn($("listpane")) || typingIn($("inspector")) || typingIn($("sheet"));
  if(busy){ pendingRender=true; return; }
  pendingRender=false;
  renderWork(); renderInspector();
}
document.addEventListener("focusout",()=>setTimeout(()=>{ if(pendingRender && !typingIn($("listpane")) && !typingIn($("inspector")) && !typingIn($("sheet"))) render(); },0));

function navBtn(v,label,count,{icon,dot,cls,dim}={}){
  return `<button class="nav${dim?" dim":""}" data-act="view" data-v="${esc(v)}" aria-current="${view===v}">${icon?ic(icon):""}${dot?`<i class="dot" style="--c:var(--s-${dot})"></i>`:""}<span class="lbl">${esc(label)}</span><span class="cnt${cls?" "+cls:""}">${count||""}</span></button>`;
}
function renderSide(){
  const n=k=>itemsFor(k).length;
  const waiting=contacts.filter(c=>inCountry(c)&&c.status!=="blacklisted"&&pendingKeys(c).length).length;
  const active=contacts.filter(c=>c.status!=="blacklisted");
  const scope=active.filter(inCountry);
  const sc={}; scope.forEach(c=>{const s=stageOf(c); sc[s]=(sc[s]||0)+1;});
  const cc={}; active.forEach(c=>{const k=c.country||"Unknown"; cc[k]=(cc[k]||0)+1;});
  const lr=meta.lastRun?new Date(meta.lastRun).toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
  $("side").innerHTML=`
    <div class="brand"><b>Outreach Desk</b><span>${lr?`Claude ran ${esc(lr)}`:"Waiting for Claude's first run"}</span>${meta.lastRunNote?`<span class="note">${esc(meta.lastRunNote)}</span>`:""}</div>
    <nav class="navsec"><h3>To do</h3>
      ${navBtn("needs","Review drafts",waiting,{icon:"check",cls:waiting?"hot":""})}
      ${navBtn("ready","Ready to send",n("ready"),{icon:"send",cls:n("ready")?"ok":""})}
      ${navBtn("due","Due",n("due"),{icon:"clock"})}
      ${navBtn("replies","Replies",n("replies"),{icon:"bubble",cls:n("replies")?"ok":""})}
      ${navBtn("stale","Stale invites",n("stale"),{icon:"hourglass",cls:n("stale")?"bad":""})}
    </nav>
    <nav class="navsec"><h3>Pipeline</h3>
      ${navBtn("all","Everyone",scope.length,{icon:"people"})}
      ${PIPE.map(k=>navBtn("stage:"+k,LABEL[k],sc[k]||0,{dot:k,dim:!sc[k]})).join("")}
      ${navBtn("blacklist","Blacklist",n("blacklist"),{icon:"block"})}
    </nav>
    <nav class="navsec"><h3>Countries</h3>
      <button class="nav" data-act="country" data-c="all" aria-current="${country==="all"}">${ic("globe")}<span class="lbl">All countries</span><span class="cnt">${active.length}</span></button>
      ${Object.keys(cc).sort().map(k=>`<button class="nav" data-act="country" data-c="${esc(k)}" aria-current="${country===k}"><i class="dot" style="--c:var(--fg-3);opacity:.5"></i><span class="lbl">${esc(k)}</span><span class="cnt">${cc[k]}</span></button>`).join("")}
    </nav>
    <div class="sidefoot"><span class="keyhint"><kbd>↑</kbd><kbd>↓</kbd> move · <kbd>A</kbd> approve</span></div>`;
}
function renderOverview(){
  const scope=contacts.filter(c=>c.status!=="blacklisted"&&inCountry(c));
  const sc={}; scope.forEach(c=>{const s=stageOf(c); sc[s]=(sc[s]||0)+1;});
  const total=scope.length||1;
  const sent=contacts.filter(c=>inCountry(c)&&c.requestedAt), acc=sent.filter(c=>c.acceptedAt);
  const msgd=contacts.filter(c=>inCountry(c)&&c.thankedAt), rep=contacts.filter(c=>inCountry(c)&&c.repliedAt);
  const wk=contacts.filter(c=>t(c.requestedAt)>Date.now()-7*day).length;
  const td=contacts.filter(c=>t(c.requestedAt)>Date.now()-day).length;
  const cap=settings.weeklyCap, dcap=settings.dailyCap;
  const lvl=(v,c)=>v>c?"bad":(v>=c*.8?"warn":"");
  const pct=(a,b)=>b?Math.round(a/b*100)+"%":"–";
  $("overview").innerHTML=`
    <div>
      <div class="segbar" role="img" aria-label="People by stage">${PIPE.filter(k=>sc[k]).map(k=>`<i style="--c:var(--s-${k});flex-grow:${sc[k]}" title="${LABEL[k]}: ${sc[k]}"></i>`).join("")||`<i style="--c:var(--fill-2);flex-grow:1"></i>`}</div>

function bulkBar(items){

/* ---------- writes ---------- */
async function post(id,patch,event){
  const r=await fetch("/api/contacts/"+encodeURIComponent(id),{method:"POST",headers:{"Content-Type":"application/json","X-Outreach-Desk":"1"},body:JSON.stringify({patch,event,by:"You"})});
  if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error||r.status);
}
async function write(c,patch,event,msg){
  try{ await post(c.id,patch,event); if(msg!==false) toast(msg||event||"Saved"); await poll(true); }
  catch{ toast("Could not save. Is the Outreach Desk server running?"); }
}
const textOf=(id,k)=>document.querySelector(`textarea[data-draft="${k}"][data-id="${CSS.escape(id)}"]`)?.value;
async function setApproved(c,k,on){
  const text=textOf(c.id,k)??drafts(c)[k].text;
  const patch={drafts:{[k]:{approved:on,text}}}; if(text!==drafts(c)[k].text) patch.drafts[k].editedByUser=true;
  await write(c,patch,on?`Approved ${DNAME[k].toLowerCase()}`:`Unapproved ${DNAME[k].toLowerCase()}`,false);
}
async function bulkApprove(on){
  const pool=contacts.filter(c=>inCountry(c)&&c.status!=="blacklisted");
  const jobs=[]; pool.forEach(c=>(on?pendingKeys(c):approvedKeys(c)).forEach(k=>jobs.push([c,k])));
  if(!jobs.length) return;
  let done=0;
  for(const [c,k] of jobs){ const text=textOf(c.id,k)??drafts(c)[k].text;
    try{ await post(c.id,{drafts:{[k]:{approved:on,text}}},on?`Approved ${DNAME[k].toLowerCase()}`:`Unapproved ${DNAME[k].toLowerCase()}`); done++; }catch{} }
  await poll(true);
  toast(`${on?"Approved":"Unapproved"} ${done} draft${done===1?"":"s"}`, on?{label:"Undo",fn:()=>undoApprove(jobs)}:null);
}
async function undoApprove(jobs){ for(const [c,k] of jobs){ try{ await post(c.id,{drafts:{[k]:{approved:false}}},`Unapproved ${DNAME[k].toLowerCase()}`);}catch{} } await poll(true); toast("Undone"); }
async function blacklist(c){
  const pending=["requested","stale"].includes(c.status)||stageOf(c)==="stale";
  const overdue=t(c.requestedAt)+settings.staleDays*day<Date.now();
  return post(c.id,{status:"blacklisted",prevStatus:c.status,blacklistedAt:new Date().toISOString(),
    blacklistReason:pending&&overdue?`No answer in ${settings.staleDays} days`:"Your choice",withdrawPending:pending},
    pending?"Blacklisted, invite withdrawal queued":"Blacklisted");
}
function arm(b,label){ if(b.dataset.armed==="1") return true; b.dataset.armed="1"; const old=b.innerHTML; b.textContent=label||"Click again to confirm";
  setTimeout(()=>{ if(b.isConnected){ b.dataset.armed="0"; b.innerHTML=old; } },3500); return false; }

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  if(e.target.closest("textarea,input,select,a") && b.dataset.act==="select") return;
  const act=b.dataset.act, c=contacts.find(x=>x.id===b.dataset.id), k=b.dataset.k;
  switch(act){
    case "view": view=b.dataset.v; save("od-view",view); if(mode==="board"){ mode="list"; save("od-mode",mode); } render(); $("listpane").scrollTop=0; return;
    case "country": country=b.dataset.c; save("od-country",country); render(); return;
    case "select": { const isCard=!!b.closest(".rcard"); if(selId===b.dataset.id && (inspOpen||isCard)) return; selId=b.dataset.id; if(!isCard) inspOpen=true; render(); return; }
    case "open": selId=b.dataset.id; inspOpen=true; render(); return;
    case "close": inspOpen=false; render(); return;
    case "approve": if(c) await setApproved(c,k||pendingKeys(c)[0],true); return;
    case "unapprove": if(c) await setApproved(c,k,false); return;
    case "approve-all": return bulkApprove(true);
    case "unapprove-all": return bulkApprove(false);
    case "run": return $("runBtn").click();
    case "copy": { const txt=textOf(c.id,k)??drafts(c)[k].text; try{ await navigator.clipboard.writeText(txt); toast("Copied to the clipboard"); }catch{ toast("Copy failed: select the text and press ⌘C"); } return; }
    case "sent": { const now=new Date().toISOString(), [s,f]=SENT_STATUS[k], text=textOf(c.id,k)??drafts(c)[k].text;
      return write(c,{status:s,[f]:now,drafts:{[k]:{text,sentAt:now}}},`Sent ${DNAME[k].toLowerCase()} (by you)`); }
    case "setstatus": { const v=$("statusSel")?.value; if(c&&v&&v!==c.status){ const p={status:v}; const f=STAMP[v]; if(f&&!c[f]) p[f]=new Date().toISOString(); await write(c,p,`Status set to ${LABEL[v]}`); } return; }
    case "replied": return write(c,{status:"replied",repliedAt:new Date().toISOString()},"They replied");
    case "blacklist": if(!arm(b)) return; try{ await blacklist(c); toast("Blacklisted"); await poll(true);}catch{ toast("Could not save"); } return;
    case "restore": { const back=c.withdrawnAt?"found":(c.prevStatus||"requested"); return write(c,{status:back,withdrawPending:false,blacklistReason:""},"Restored from blacklist"); }
    case "bl-all": { if(!arm(b)) return; const items=itemsFor("stale"); for(const x of items){ try{ await blacklist(x);}catch{} } await poll(true); toast(`Blacklisted ${items.length}, withdrawals queued for Claude`); return; }
  }
});
document.addEventListener("input",e=>{ if(e.target.matches("textarea.msg")) autosize(e.target); });
document.addEventListener("change",async e=>{
  const el=e.target;
  if(el.matches("textarea.msg")){ const c=contacts.find(x=>x.id===el.dataset.id), k=el.dataset.draft; if(!c) return;
    if(el.value!==drafts(c)[k].text) await write(c,{drafts:{[k]:{text:el.value,editedByUser:true}}},null,"Draft saved"); }
  if(el.matches("textarea.notes")){ const c=contacts.find(x=>x.id===el.dataset.notes); if(c&&el.value!==(c.notes||"")) await write(c,{notes:el.value},null,"Notes saved"); }
});
$("search").addEventListener("input",e=>{ query=e.target.value; render(); });
$("mList").addEventListener("click",()=>{ mode="list"; save("od-mode",mode); render(); });
$("mBoard").addEventListener("click",()=>{ mode="board"; save("od-mode",mode); render(); });
window.addEventListener("resize",()=>{ clearTimeout(window._rz); window._rz=setTimeout(render,150); });
document.addEventListener("keydown",e=>{
  const typing=/^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement?.tagName);
  if(e.key==="Escape"){ if(!$("runModal").hidden||!$("addModal").hidden){ closeDialogs(); return; } if(typing){ document.activeElement.blur(); return; } if(inspOpen){ inspOpen=false; render(); } else if(selId){ selId=null; render(); } return; }
  if(typing||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="/"){ e.preventDefault(); $("search").focus(); return; }
  if(e.key==="Enter"&&document.activeElement?.dataset?.act==="select"){ document.activeElement.click(); return; }
  if(mode==="list"&&(e.key==="ArrowDown"||e.key==="ArrowUp"||e.key==="j"||e.key==="k")){
    e.preventDefault(); if(!visibleIds.length) return;
    const i=visibleIds.indexOf(selId), dn=e.key==="ArrowDown"||e.key==="j";
    selId=visibleIds[Math.max(0,Math.min(visibleIds.length-1,i<0?0:i+(dn?1:-1)))]; render();
    document.querySelector(`[data-act="select"][data-id="${CSS.escape(selId)}"]`)?.scrollIntoView({block:"nearest"}); return;
  }
  if((e.key==="a"||e.key==="A")&&selId){ const c=contacts.find(x=>x.id===selId); if(!c) return;
    const p=pendingKeys(c), a=approvedKeys(c); if(p.length) setApproved(c,p[0],true); else if(a.length) setApproved(c,a[0],false); }
});

/* board drag and drop */
let dragId=null;
document.addEventListener("dragstart",e=>{ const el=e.target.closest?.(".card"); if(!el) return; dragId=el.dataset.id; el.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain",dragId); });
document.addEventListener("dragend",e=>{ e.target.classList?.remove("dragging"); document.querySelectorAll(".col.over").forEach(x=>x.classList.remove("over")); });
document.addEventListener("dragover",e=>{ const col=e.target.closest?.(".col"); if(!col||!dragId) return; e.preventDefault(); document.querySelectorAll(".col.over").forEach(x=>x!==col&&x.classList.remove("over")); col.classList.add("over"); });
document.addEventListener("drop",async e=>{ const col=e.target.closest?.(".col"); if(!col||!dragId) return; e.preventDefault(); col.classList.remove("over");
  const c=contacts.find(x=>x.id===dragId); dragId=null; const to=col.dataset.col; if(!c||stageOf(c)===to) return;
  if(to==="blacklisted"){ try{ await blacklist(c); toast("Blacklisted"); await poll(true);}catch{} return; }
  if(to==="stale"){ toast("Stale is automatic: invites without an answer for 21 days"); return; }
  const p={status:to}; const f=STAMP[to]; if(f&&!c[f]) p[f]=new Date().toISOString();
  await write(c,p,`Moved to ${LABEL[to]||to}`);
});

/* ---------- toast ---------- */
function toast(msg,action){ const el=$("toast"); $("toastMsg").textContent=msg; const a=$("toastAct");
  if(action){ a.hidden=false; a.textContent=action.label; a.onclick=()=>{ el.hidden=true; action.fn(); }; } else { a.hidden=true; a.onclick=null; }
  el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,action?6000:2200); }

/* ---------- run changes ---------- */
function queueItems(){ const out=[]; contacts.forEach(c=>{ approvedKeys(c).forEach(k=>out.push(`Send ${DNAME[k].toLowerCase()} to ${c.name}`)); if(c.withdrawPending) out.push(`Withdraw invite to ${c.name}`); }); return out; }
function renderRun(){
  const q=queueItems(), b=$("runBtn"), st=runReq.status;
  b.className="run";
  if(st==="running"){ b.classList.add("running"); $("runLabel").textContent="Claude is running…"; }
  else if(st==="requested"){ b.classList.add("waiting"); $("runLabel").textContent=`Waiting for Claude · ${q.length}`; }
  else if(q.length){ b.classList.add("ready"); $("runLabel").textContent=`Run ${q.length} change${q.length>1?"s":""}`; }
  else $("runLabel").textContent=st==="done"&&runReq.doneAt?`All done · ${new Date(runReq.doneAt).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})}`:"Nothing to run";
  if(!$("runModal").hidden) renderRunModal();
}
function renderRunModal(){
  const q=queueItems(), st=runReq.status;
  const head=st==="running"?"Claude is working on it":st==="done"&&!q.length?"Everything is done":`${q.length} change${q.length===1?"":"s"} sent to Claude`;
  $("runModal").innerHTML=`<div class="dh"><h2 id="runTitle">${esc(head)}</h2><button class="x" id="runClose" aria-label="Close">${ic("x")}</button></div>
    ${q.length?`<ol>${q.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:""}
    ${st==="running"?`<p style="margin:0;color:var(--fg-2);font-size:13px">Keep Claude's browser window open. This page updates as each step finishes.</p>`:""}
    ${st==="done"&&runReq.note?`<p style="margin:0;color:var(--fg-2);font-size:13px">Last run: ${esc(runReq.note)}</p>`:""}
    ${st==="requested"?`
    <div class="step"><b>If Claude is watching the desk</b><span>It starts on its own within a few seconds, and this button changes to “Claude is running”.</span></div>
    <div class="step"><b>If nothing happens</b><span>Open Claude Code in the project where this skill is installed and send this:</span>
      <div class="cmd"><span id="runCmd">${RUN_PROMPT}</span><button class="btn small" id="copyRun">Copy</button></div></div>
    <div class="step"><b>Make it automatic</b><span>Once per Claude session, send “Watch the Outreach Desk”. From then on this button starts Claude directly.</span></div>
    <p style="margin:0;color:var(--fg-3);font-size:12.5px">LinkedIn must be logged in in Claude's browser window.</p>`:""}`;
}
async function requestRun(){ try{ const r=await fetch("/api/run",{method:"POST",headers:{"Content-Type":"application/json","X-Outreach-Desk":"1"},body:"{}"}); if(!r.ok) throw 0; await poll(true);}catch{ toast("Could not reach the Outreach Desk server"); } }
$("runBtn").addEventListener("click",async()=>{
  const q=queueItems(), st=runReq.status;
  if(q.length&&st!=="requested"&&st!=="running") await requestRun();
  else if(!q.length&&!["requested","running","done"].includes(st)){ toast("Nothing to run yet. Approve a draft or blacklist an invite first."); return; }
  $("runModal").hidden=false; $("scrim").hidden=false; renderRunModal();
});
function closeDialogs(){ $("runModal").hidden=true; $("addModal").hidden=true; $("scrim").hidden=true; }
$("scrim").addEventListener("click",closeDialogs);
document.addEventListener("click",async e=>{
  if(e.target.closest("#runClose")) closeDialogs();
  if(e.target.closest("#copyRun")){ try{ await navigator.clipboard.writeText(RUN_PROMPT); toast("Copied. Paste it in Claude Code"); }catch{ toast("Select the text and press ⌘C"); } }
});

/* ---------- add person ---------- */
function slugFor(url,name){ const m=(url||"").match(/linkedin\.com\/in\/([^/?#]+)/i);
  let s=m?decodeURIComponent(m[1]):(name+"-"+Date.now().toString(36));
  return s.normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9_-]+/g,"-").replace(/^-+|-+$/g,"").toLowerCase().slice(0,120); }
$("addBtn").addEventListener("click",()=>{ $("addModal").reset(); $("addMsg").textContent=""; $("addModal").hidden=false; $("scrim").hidden=false; $("fName").focus(); });
$("addClose").addEventListener("click",closeDialogs);
$("addModal").addEventListener("submit",async e=>{
  e.preventDefault(); const name=$("fName").value.trim(); if(!name) return;
  let url=$("fUrl").value.trim(); const m=url.match(/linkedin\.com\/in\/([^/?#]+)/i); if(m) url="https://www.linkedin.com/in/"+m[1]+"/";
  const status=$("fStatus").value, now=new Date().toISOString();
  const contact={name,linkedinUrl:url,headline:$("fHead").value.trim(),company:$("fCo").value.trim(),country:$("fCountry").value.trim()||"Unknown",group:$("fGroup").value,status,source:"Added by hand"};
  if(status!=="found") contact.requestedAt=now; if(status==="accepted") contact.acceptedAt=now;
  try{ const id=slugFor(url,name); const r=await fetch("/api/contacts",{method:"POST",headers:{"Content-Type":"application/json","X-Outreach-Desk":"1"},body:JSON.stringify({id,contact})});
    const d=await r.json().catch(()=>({})); if(!r.ok){ $("addMsg").textContent=d.error||"Could not add"; return; }
    closeDialogs(); selId=id; inspOpen=true; toast("Added "+name); await poll(true);
  }catch{ $("addMsg").textContent="The server isn't answering"; }
});

/* ---------- sync ---------- */
let rev=-1, failed=0;
async function poll(force){
  try{ const r=await fetch("/api/state"+(force||rev<0?"":"?rev="+rev),{cache:"no-store"});
    if(r.status===200){ const d=await r.json(); rev=d.rev; contacts=d.contacts; settings={...DEFAULTS,...(d.meta?.settings||{})}; meta=d.meta?.run||{}; runReq=d.meta?.runRequest||{}; loaded=true;
      if(selId&&!contacts.some(c=>c.id===selId)) selId=null; render(); }
    failed=0; $("banner").hidden=true;
  }catch{ if(++failed>=2){ $("banner").hidden=false; $("banner").textContent="The Outreach Desk server isn't answering. Ask Claude to open the Outreach Desk, or run: python3 app/launch.py"; } }
}
poll(true); setInterval(()=>{ if(!document.hidden) poll(false); },4000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) poll(false); });
</script>
