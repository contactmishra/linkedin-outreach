/* Outreach Desk. A console for approving outreach and watching it go out.
   Two themes, hairline surfaces, one violet for actions and selection, a status ring per pipeline stage,
   a green seal for approval, and a live panel that mirrors Claude's browser while it works.
   Layout: rail · header · pipeline strip · work area (review cards or people table) · inspector · live panel. */
:root{
  color-scheme:light;
  --bg:oklch(0.985 0.003 275); --rail:oklch(0.966 0.006 275); --surface:oklch(1 0 0); --surface-2:oklch(0.972 0.005 275); --sunk:oklch(0.975 0.004 275);
  --text:oklch(0.23 0.022 275); --text-2:oklch(0.44 0.02 275); --text-3:oklch(0.54 0.018 275);
  --line:oklch(0.23 0.022 275 / .09); --line-2:oklch(0.23 0.022 275 / .16); --fill:oklch(0.23 0.022 275 / .045); --fill-2:oklch(0.23 0.022 275 / .085);
  --brand:oklch(0.53 0.235 285); --brand-2:oklch(0.47 0.235 285); --brand-soft:oklch(0.53 0.235 285 / .1); --brand-text:oklch(0.48 0.225 285); --on-brand:oklch(0.99 0.005 285);
  --i-found:oklch(0.55 0.018 275); --i-requested:oklch(0.52 0.17 255); --i-accepted:oklch(0.52 0.11 210);
  --i-thanked:oklch(0.52 0.12 165); --i-cv_sent:oklch(0.52 0.21 320); --i-followed_up:oklch(0.55 0.13 70);
  --i-replied:oklch(0.52 0.15 150); --i-done:oklch(0.5 0.03 150); --i-stale:oklch(0.55 0.21 25); --i-blacklisted:oklch(0.4 0.015 275);
  --i-ok:var(--i-replied); --i-warn:var(--i-followed_up); --i-bad:var(--i-stale); --i-edit:var(--brand-text);
  --card-shadow:0 1px 2px oklch(0.23 0.022 275 / .05);
  --lift:0 2px 4px oklch(0.23 0.022 275 / .05),0 10px 24px oklch(0.23 0.022 275 / .08);
  --shadow:0 2px 6px oklch(0.23 0.022 275 / .08),0 18px 48px oklch(0.23 0.022 275 / .18);
  --glow:0 0 0 1px oklch(0.53 0.235 285 / .35),0 12px 40px oklch(0.53 0.235 285 / .2);
  --aura:oklch(0.53 0.235 285 / .06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --cond:"Desk Stamp","Avenir Next Condensed","Arial Narrow",var(--font);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:8px; --r-card:12px; --r-panel:16px;
  --ease:cubic-bezier(.16,1,.3,1); --ease-io:cubic-bezier(.65,0,.35,1);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:oklch(0.17 0.012 275); --rail:oklch(0.148 0.012 275); --surface:oklch(0.205 0.014 275); --surface-2:oklch(0.24 0.016 275); --sunk:oklch(0.15 0.012 275);
  --text:oklch(0.955 0.005 275); --text-2:oklch(0.76 0.012 275); --text-3:oklch(0.635 0.014 275);
  --line:oklch(1 0 0 / .075); --line-2:oklch(1 0 0 / .14); --fill:oklch(1 0 0 / .045); --fill-2:oklch(1 0 0 / .09);
  --brand:oklch(0.56 0.225 285); --brand-2:oklch(0.5 0.225 285); --brand-soft:oklch(0.62 0.21 285 / .16); --brand-text:oklch(0.79 0.125 285); --on-brand:oklch(0.99 0.005 285);
  --i-found:oklch(0.68 0.016 275); --i-requested:oklch(0.74 0.13 255); --i-accepted:oklch(0.78 0.11 210);
  --i-thanked:oklch(0.79 0.13 165); --i-cv_sent:oklch(0.76 0.16 320); --i-followed_up:oklch(0.81 0.13 75);
  --i-replied:oklch(0.8 0.16 150); --i-done:oklch(0.7 0.04 150); --i-stale:oklch(0.72 0.18 25); --i-blacklisted:oklch(0.62 0.012 275);
  --card-shadow:inset 0 1px 0 oklch(1 0 0 / .04);
  --lift:inset 0 1px 0 oklch(1 0 0 / .06),0 10px 28px oklch(0 0 0 / .35);
  --shadow:0 2px 6px oklch(0 0 0 / .4),0 22px 60px oklch(0 0 0 / .55);
  --glow:0 0 0 1px oklch(0.62 0.21 285 / .5),0 14px 50px oklch(0.56 0.225 285 / .32);
  --aura:oklch(0.56 0.225 285 / .13);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:oklch(0.17 0.012 275); --rail:oklch(0.148 0.012 275); --surface:oklch(0.205 0.014 275); --surface-2:oklch(0.24 0.016 275); --sunk:oklch(0.15 0.012 275);
  --text:oklch(0.955 0.005 275); --text-2:oklch(0.76 0.012 275); --text-3:oklch(0.635 0.014 275);
  --line:oklch(1 0 0 / .075); --line-2:oklch(1 0 0 / .14); --fill:oklch(1 0 0 / .045); --fill-2:oklch(1 0 0 / .09);
  --brand:oklch(0.56 0.225 285); --brand-2:oklch(0.5 0.225 285); --brand-soft:oklch(0.62 0.21 285 / .16); --brand-text:oklch(0.79 0.125 285); --on-brand:oklch(0.99 0.005 285);
  --i-found:oklch(0.68 0.016 275); --i-requested:oklch(0.74 0.13 255); --i-accepted:oklch(0.78 0.11 210);
  --i-thanked:oklch(0.79 0.13 165); --i-cv_sent:oklch(0.76 0.16 320); --i-followed_up:oklch(0.81 0.13 75);
  --i-replied:oklch(0.8 0.16 150); --i-done:oklch(0.7 0.04 150); --i-stale:oklch(0.72 0.18 25); --i-blacklisted:oklch(0.62 0.012 275);
  --card-shadow:inset 0 1px 0 oklch(1 0 0 / .04);
  --lift:inset 0 1px 0 oklch(1 0 0 / .06),0 10px 28px oklch(0 0 0 / .35);
  --shadow:0 2px 6px oklch(0 0 0 / .4),0 22px 60px oklch(0 0 0 / .55);
  --glow:0 0 0 1px oklch(0.62 0.21 285 / .5),0 14px 50px oklch(0.56 0.225 285 / .32);
  --aura:oklch(0.56 0.225 285 / .13);
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;accent-color:var(--brand);caret-color:var(--brand);scrollbar-color:var(--line-2) transparent}
::selection{background:oklch(0.56 0.225 285 / .28)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--brand-text);outline-offset:2px;border-radius:var(--r)}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3,p{margin:0}

/* ---------- status: a ring that fills as the person moves along ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text);white-space:nowrap}
svg.sg{width:14px;height:14px;flex:none;color:var(--c,var(--text-3))}
.chip.pill{border:1px solid var(--line-2);border-radius:999px;padding:2px 9px 2px 7px;font-size:12.5px}
.chip.pill.cur{border-color:transparent;background:color-mix(in oklch,var(--c) 15%,transparent);font-weight:600}
.chip.pill.ghost{border-style:dashed;color:var(--text-3)}
.chip.pill span{color:var(--text-2);font-weight:400}

/* ---------- seal: what you decided ---------- */
.stamp{display:inline-flex;align-items:baseline;gap:5px;border:1.5px solid currentColor;border-radius:4px;padding:1px 6px 0;color:var(--c,var(--text-2));font:600 12px/1.5 var(--cond);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.stamp.seal{outline:1px solid currentColor;outline-offset:2px;margin:3px;transform:rotate(-3deg)}
.stamp.seal.flat{transform:none}
.s-need{--c:var(--i-warn)} .s-ok{--c:var(--i-ok)} .s-edit{--c:var(--i-edit)} .s-sent{--c:var(--i-found)} .s-bad{--c:var(--i-bad)}

/* ---------- shell ---------- */
.app{height:100vh;height:100dvh;display:grid;grid-template-columns:240px minmax(0,1fr)}
.app.withlive{grid-template-columns:240px minmax(0,1fr) minmax(460px,42%)}
.side{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px;min-height:0;padding:16px 10px 12px}
.sidescroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:20px;margin-right:-6px;padding-right:6px}
.main{container:main/inline-size;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);min-width:0;min-height:0;background:radial-gradient(900px 260px at 22% -150px,var(--aura),transparent 70%)}

/* rail */
.brand{padding:2px 8px 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:1px 10px;align-items:center}
.brand svg.logo{width:28px;height:28px;grid-row:span 2;border-radius:8px}
.brand b{font:650 15px/1.2 var(--font);letter-spacing:-.015em}
.brand span{font-size:12px;line-height:1.35;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .note{grid-column:1/-1;margin-top:8px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--text-2)}
.navsec{display:grid;gap:1px}
.navsec h3{margin:0 0 4px;padding:0 8px;font-size:12px;font-weight:500;color:var(--text-3)}
.nav{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;border-radius:var(--r);padding:6px 8px;text-align:left;color:var(--text-2);font-size:13.5px;position:relative;transition:background-color .16s var(--ease),color .16s var(--ease)}
.nav:hover{background:var(--fill);color:var(--text)}
.nav:active{background:var(--fill-2)}
.nav[aria-current="true"]{color:var(--text);font-weight:550}
.nav[aria-current="true"]::before{content:"";position:absolute;inset:0;border-radius:var(--r);background:var(--fill-2);box-shadow:inset 0 0 0 1px var(--line);z-index:-1}
.nav.v[aria-current="true"]::before{view-transition-name:navsel}
.nav.c[aria-current="true"]::before{view-transition-name:ctrysel}
.navsec{isolation:isolate}
.nav .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .cnt{font-size:12px;color:var(--text-3);min-width:16px;text-align:right}
.nav .cnt.hot{background:var(--brand);color:var(--on-brand);border-radius:999px;padding:0 7px;font-weight:600;text-align:center}
.nav svg.i{color:var(--text-3)}
.nav[aria-current="true"] svg.i{color:var(--brand-text)}
.sidefoot{padding:12px 8px 0;border-top:1px solid var(--line);display:grid;gap:10px}
.lim{display:grid;gap:5px;font-size:12px;color:var(--text-3)}
.lim div{display:flex;justify-content:space-between;gap:8px}
.lim b{color:var(--text);font-weight:550}
.lim .sm{display:none}
.lim i{display:block;height:4px;border-radius:2px;background:var(--fill-2);overflow:hidden}
.lim i u{display:block;height:100%;background:var(--brand);border-radius:2px}
.lim.warn i u{background:var(--i-warn)} .lim.bad i u{background:var(--i-bad)}
.lim.bad b{color:var(--i-bad)}
.footrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.keyhint{font-size:12px;color:var(--text-3)}
kbd{font:500 11px var(--font);background:var(--fill);border:1px solid var(--line-2);border-radius:4px;padding:1px 5px;color:var(--text-2)}
.theme{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:2px;gap:1px}
.theme button{border:0;background:transparent;border-radius:999px;width:24px;height:22px;display:grid;place-items:center;color:var(--text-3)}
.theme button:hover{color:var(--text)}
.theme button[aria-pressed="true"]{background:var(--fill-2);color:var(--text)}
.theme svg.i{width:14px;height:14px}

/* header */
.toolbar{display:flex;align-items:center;gap:8px;padding:16px 24px 14px;min-width:0;flex-wrap:wrap}
.vt{min-width:0;flex:1 1 260px}
.vt h1{font:650 22px/1.2 var(--font);letter-spacing:-.022em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vt p{margin-top:2px;font-size:13px;color:var(--text-2)}
.search{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:5px 8px 5px 9px;width:220px;max-width:100%;color:var(--text-3);box-shadow:var(--card-shadow);transition:border-color .16s var(--ease),box-shadow .16s var(--ease),width .26s var(--ease)}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);width:270px}
.search input{border:0;background:transparent;outline:0;width:100%;min-width:0;color:var(--text);font-size:13.5px}
.search input::placeholder{color:var(--text-3)}
.search:focus-within kbd{visibility:hidden}
@media (hover:none){.search kbd{display:none}}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);padding:3px;gap:2px;background:var(--surface);box-shadow:var(--card-shadow)}
.seg button{border:0;background:transparent;border-radius:5px;padding:2px 10px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);position:relative;transition:color .16s var(--ease)}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{color:var(--text);font-weight:550}
.seg button[aria-pressed="true"]::before{content:"";position:absolute;inset:0;border-radius:6px;background:var(--fill-2);view-transition-name:segsel}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:5px 12px;font-size:13px;font-weight:500;color:var(--text);box-shadow:var(--card-shadow);transition:background-color .16s var(--ease),border-color .16s var(--ease),transform .12s var(--ease),box-shadow .16s var(--ease);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.primary,.btn.go{background:var(--brand);border-color:transparent;color:var(--on-brand);font-weight:600;box-shadow:inset 0 1px 0 oklch(1 0 0 / .18),0 1px 2px oklch(0.3 0.2 285 / .35)}
.btn.primary:hover,.btn.go:hover{background:var(--brand-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand-text);box-shadow:none}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.danger{color:var(--i-bad)}
.btn.danger[data-armed="1"]{background:var(--i-bad);border-color:var(--i-bad);color:var(--surface);transition:none}
.btn.small{padding:3px 9px;font-size:12.5px;border-radius:7px}

/* run changes */
.run{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:var(--r);padding:6px 14px;font-weight:600;font-size:13px;background:transparent;color:var(--text-3);position:relative;transition:transform .12s var(--ease),background-color .2s var(--ease),box-shadow .2s var(--ease)}
.run:active{transform:scale(.97)}
.run .d{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.6}
.run.ready{background:var(--brand);border-color:transparent;color:var(--on-brand);box-shadow:inset 0 1px 0 oklch(1 0 0 / .2),0 6px 20px oklch(0.53 0.235 285 / .38)}
.run.ready:hover{background:var(--brand-2)}
.run.ready .d{opacity:1}
.run.waiting{border-color:var(--i-warn);color:var(--i-warn)}
.run.running{border-color:var(--brand);color:var(--brand-text);background:var(--brand-soft)}

/* pipeline strip */
.overview{display:flex;gap:28px;align-items:stretch;padding:0 24px;border-block:1px solid var(--line)}
.pipe{display:flex;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.pc{flex:1 1 0;min-width:104px;display:grid;gap:3px;align-content:start;text-align:left;border:0;border-right:1px solid var(--line);background:transparent;padding:11px 10px 10px;position:relative;transition:background-color .16s var(--ease)}
.pc:first-child{border-left:1px solid var(--line)}
.pc:hover{background:var(--fill)}
.pc[aria-pressed="true"]{background:var(--fill)}
.pc[aria-pressed="true"]::before{content:"";position:absolute;inset:auto 0 -1px;height:2px;background:var(--c);view-transition-name:pipesel}
.pc .l{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);white-space:nowrap}
.pc b{font:600 22px/1.15 var(--font);letter-spacing:-.025em}
.pc i{display:block;height:3px;margin-top:3px;background:var(--fill-2);border-radius:1.5px}
.pc i u{display:block;height:100%;min-width:3px;background:var(--c);border-radius:1.5px}
.pc.zero b{color:var(--text-3);font-weight:500}
.pc.zero i u{display:none}
.rates{display:flex;gap:20px;align-items:center;padding:8px 0;flex:none}
.rate{display:grid;gap:1px}
.rate span{font-size:12.5px;color:var(--text-2)}
.rate b{font:600 22px/1.15 var(--font);letter-spacing:-.025em}
.rate em{font-style:normal;font-size:12px;color:var(--text-3)}

/* work area */
.work{display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
.work.withinsp{grid-template-columns:minmax(0,1fr) minmax(380px,34%)}
.work.boardmode{grid-template-columns:minmax(0,1fr)}
.listpane{min-height:0;overflow-y:auto;container-type:inline-size}
.inspector{border-left:1px solid var(--line);min-height:0;overflow-y:auto;background:var(--surface);view-transition-name:insp}
.boardpane{min-height:0;overflow:auto;padding:16px 24px 20px}

/* bulk bar */
.bulk{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:14px;padding:10px 24px;background:var(--bg);border-bottom:1px solid var(--line);flex-wrap:wrap}
.bulk .txt{font-size:13px;color:var(--text-2)}
.bulk .txt b{color:var(--text)}
.prog{flex:1;min-width:120px;max-width:300px;height:4px;border-radius:2px;background:var(--fill-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--i-ok);border-radius:2px}
.bulk .sp{flex:1}

/* people table */
.rgrid{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.4fr) 136px minmax(0,1.6fr) 104px 128px;gap:14px;align-items:center;padding:0 24px}
.thead{position:sticky;top:0;z-index:1;background:var(--bg);border-bottom:1px solid var(--line-2);height:34px}
.th{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;padding:4px 0;font-size:12.5px;font-weight:500;color:var(--text-3);justify-self:start;border-radius:4px;transition:color .16s var(--ease)}
.th:hover{color:var(--text)}
span.th{cursor:default}
.th svg{width:10px;height:10px;fill:currentColor;opacity:0;transition:transform .2s var(--ease)}
.th[data-dir]{color:var(--text)}
.th[data-dir] svg{opacity:1}
.th[data-dir="desc"] svg{transform:rotate(180deg)}
.rows{padding-bottom:24px}
.row{min-height:54px;padding-block:8px;border-bottom:1px solid var(--line);cursor:default;transition:background-color .14s var(--ease)}
.row:hover{background:var(--fill)}
.row.sel{background:var(--brand-soft)}
.row:focus-visible{outline-offset:-2px}
.who{min-width:0}
.who b{display:block;font-weight:550;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{display:block;font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .mstg{display:none}
.who .chip{display:inline-flex;color:var(--text);overflow:visible}
.co{min-width:0;font-size:13px}
.co span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co span+span{font-size:12.5px;color:var(--text-3)}
.nx{min-width:0;font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{font-size:13px;color:var(--text-2);white-space:nowrap}
.when.late{color:var(--i-bad);font-weight:550}
.act{display:flex;justify-content:flex-end}
@container (max-width:920px){.rgrid{grid-template-columns:minmax(0,2fr) 136px minmax(0,1.4fr) 128px}.rgrid .c-co,.rgrid .c-due{display:none}}
@container (max-width:600px){.rgrid{grid-template-columns:minmax(0,1fr) auto;padding-inline:14px}.rgrid .c-stg,.rgrid .c-nx{display:none}.who .mstg{display:flex;align-items:center;gap:10px;margin-top:5px}.who .mstg>span:last-child{font-size:12.5px}}

/* what you did to this person: a seal, and the ink of the card's border */
.rcard.st-approved,.card.st-approved{border-color:var(--i-ok)}
.rcard.st-queued,.card.st-queued{border-color:var(--i-bad)}
.st-sent .who b,.st-sent .who span{color:var(--text-3)}

/* review cards */
.cards{padding:16px 24px 28px;display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:12px;align-items:start}
.rcard{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-card);padding:14px;display:grid;gap:10px;box-shadow:var(--card-shadow);transition:border-color .25s var(--ease),box-shadow .25s var(--ease),transform .25s var(--ease)}
.rcard:hover{box-shadow:var(--lift);transform:translateY(-1px)}
.rcard.sel{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand),var(--lift)}
.rhead{display:flex;align-items:center;gap:10px;min-width:0}
.rhead .who{flex:1}
.common{font-size:13px;color:var(--text-2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.common b{font-weight:550;color:var(--text)}
.dr{display:grid;gap:6px}
.drh{display:flex;align-items:center;gap:6px;min-height:28px;font-size:12.5px;color:var(--text-3)}
.drh .lab{font-weight:550;color:var(--text-2)}
.drh em{font-style:normal;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:transparent;color:var(--text-3);border-radius:7px;width:28px;height:28px;display:grid;place-items:center;flex:none;transition:background-color .14s var(--ease),color .14s var(--ease),transform .12s var(--ease)}
.iconbtn:hover{background:var(--fill-2);color:var(--text)}
.iconbtn:active{transform:scale(.92)}
textarea.msg{display:block;width:100%;resize:none;border:1px solid var(--line-2);border-radius:var(--r);background:var(--sunk);padding:9px 11px;line-height:1.5;font-size:13.5px;min-height:56px;overflow:hidden;transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
textarea.msg:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.msg[readonly]{color:var(--text-2)}
.dra{display:flex;align-items:center;gap:6px;justify-content:flex-end}

/* inspector */
.insp{padding:20px 22px 40px;display:grid;gap:20px;align-content:start}
.ihead{display:flex;gap:12px;align-items:flex-start}
.ihead h2{font:650 19px/1.25 var(--font);letter-spacing:-.02em;text-wrap:balance}
.ihead p{margin-top:3px;font-size:13px;color:var(--text-2)}
.ihead .x{margin-left:auto}
.x{border:0;background:transparent;border-radius:7px;width:28px;height:28px;display:grid;place-items:center;color:var(--text-2);flex:none;transition:background-color .14s var(--ease)}
.x:hover{background:var(--fill-2);color:var(--text)}
.ilinks{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:-8px}
.ilinks a{display:inline-flex;align-items:center;gap:5px;color:var(--brand-text);text-decoration:none;font-size:13px;font-weight:500}
.ilinks a:hover{text-decoration:underline;text-underline-offset:3px}
.journey{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.nextline{font-size:13.5px;color:var(--text)}
.nextline b{font-weight:600;margin-right:6px}
.nextline span{color:var(--text-2)}
.sec{display:grid;gap:8px}
.sec>h3{font-size:12.5px;font-weight:500;color:var(--text-3)}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 18px;font-size:13px;margin:0}
.facts dt{color:var(--text-3)}.facts dd{margin:0;overflow-wrap:anywhere}
.dbox{display:grid;gap:8px}
.dbox.st-approved textarea.msg{border-color:var(--i-ok)}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
select.sel{border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:4px 8px;font-size:13px}
textarea.notes{width:100%;min-height:70px;resize:vertical;border:1px solid var(--line-2);border-radius:var(--r);background:var(--sunk);padding:9px 11px;font-size:13.5px;line-height:1.5}
textarea.notes:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.notes::placeholder{color:var(--text-3)}
.hist{display:grid;gap:6px;font-size:12.5px;color:var(--text-2)}
.hist b{color:var(--text);font-weight:500}
.small-note{font-size:12.5px;color:var(--text-2)}

/* board */
.board{display:flex;gap:10px;height:100%;min-height:420px}
.board .col{flex:1 1 210px;min-width:190px}
.board .col.empty{flex:0 0 124px;min-width:124px}
.board .col.empty .colb{place-content:center;text-align:center;color:var(--text-3);font-size:12.5px}
.col{background:transparent;border-radius:var(--r-card);display:flex;flex-direction:column;min-height:0;border:1px solid transparent;transition:border-color .16s var(--ease),background-color .16s var(--ease)}
.col.over{border-color:var(--c);background:var(--fill)}
.colh{display:flex;align-items:center;gap:7px;padding:6px 6px 10px;font-size:13px;font-weight:550;color:var(--text)}
.colh .n{margin-left:auto;font-weight:500;color:var(--text-3)}
.colb{padding:0 4px 10px;display:grid;gap:6px;align-content:start;overflow-y:auto;min-height:0;flex:1}
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:8px 10px;display:grid;gap:2px;text-align:left;width:100%;cursor:grab;box-shadow:var(--card-shadow);transition:border-color .16s var(--ease),box-shadow .2s var(--ease),transform .2s var(--ease)}
.card:hover{box-shadow:var(--lift);transform:translateY(-1px)}
.card:active{cursor:grabbing}
.card.dragging{opacity:.4}
.card.sel{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.card b{font-size:13px;font-weight:550}
.card span{font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .nxt{white-space:normal}
.card .late{color:var(--i-bad);font-weight:550}
.card .stamp{justify-self:start;margin-top:5px;color:var(--c)}
.col.blk .colb{place-content:center;text-align:center;color:var(--text-3);font-size:12.5px;padding:16px}

/* sheet (inspector as overlay on board / narrow screens) */
.sheet{position:fixed;top:10px;right:10px;bottom:10px;width:min(440px,calc(100% - 20px));background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-panel);box-shadow:var(--shadow);z-index:20;overflow-y:auto;view-transition-name:sheet}

/* ---------- live run ---------- */
.live{border-left:1px solid var(--line);background:var(--rail);min-height:0;display:flex;flex-direction:column;view-transition-name:live}
.lv-h{display:flex;align-items:center;gap:10px;padding:14px 14px 12px 20px}
.lv-h>div{flex:1;min-width:0;display:grid}
.lv-h b{font:650 15px/1.3 var(--font);letter-spacing:-.015em}
.lv-h span{font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-dot{width:9px;height:9px;border-radius:50%;background:var(--text-3);flex:none;position:relative}
.live[data-state="requested"] .lv-dot{background:var(--i-warn)}
.live[data-state="running"] .lv-dot{background:var(--brand-text)}
.live[data-state="done"] .lv-dot{background:var(--i-ok)}
.lv-body{flex:1;min-height:0;overflow-y:auto;padding:4px 20px 24px;display:grid;gap:16px;align-content:start}
.browser{border:1px solid var(--line-2);border-radius:var(--r-card);overflow:hidden;background:var(--surface);box-shadow:var(--lift);transition:box-shadow .5s var(--ease)}
.live[data-state="running"] .browser{box-shadow:var(--glow)}
.bbar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.bbar i{width:9px;height:9px;border-radius:50%;background:var(--fill-2);border:1px solid var(--line-2)}
.burl{flex:1;min-width:0;margin-left:8px;background:var(--fill);border-radius:6px;padding:3px 10px;font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.bview{position:relative;aspect-ratio:16/10;background:var(--sunk);display:grid;place-items:center;overflow:hidden}
.bview img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:top}
.lv-wait{display:flex;gap:12px;align-items:flex-start;font-size:13px;line-height:1.45;color:var(--text-2)}
.lv-wait b{display:block;color:var(--text);font-size:14px;font-weight:600}
.lv-wait .spin{width:18px;height:18px;margin-top:2px;flex:none;border-radius:50%;border:2px solid var(--fill-2);border-top-color:var(--brand-text)}
.lv-wait svg.i{width:18px;height:18px;margin-top:2px;color:var(--text-3)}
.bdone{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:12px;background:color-mix(in oklch,var(--surface) 84%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-align:center;padding:20px;font-size:13px;color:var(--text-2)}
.bdone .stamp{font-size:16px;padding:3px 12px 1px}
.lv-steps{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.lv-steps li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;align-items:start;padding:7px 8px;border-radius:var(--r);font-size:13.5px;color:var(--text-2)}
.lv-steps li.doing{background:var(--fill);color:var(--text);font-weight:550}
.lv-steps li.done{color:var(--text)}
.lv-steps li small{display:block;font-size:12.5px;font-weight:400;color:var(--text-3)}
.lv-steps li p{margin:7px 0 2px;font-weight:400;font-size:13px;line-height:1.5;color:var(--text-2);background:var(--sunk);border:1px solid var(--line-2);border-radius:var(--r);padding:8px 10px}
.lv-steps li p span{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.lv-steps svg.ck{width:16px;height:16px;margin-top:2px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke:var(--text-3)}
.lv-steps li.done svg.ck{stroke:var(--i-ok)}
.lv-steps li.failed svg.ck{stroke:var(--i-bad)}
.lv-steps li.doing svg.ck{stroke:var(--brand-text)}
.lv-help{display:grid;gap:12px;font-size:13px;border-top:1px solid var(--line);padding-top:16px}
.lv-help .step{display:grid;gap:4px}
.lv-help .step span{color:var(--text-2)}
.cmd{display:flex;gap:8px;align-items:center;background:var(--fill);border:1px solid var(--line);border-radius:var(--r);padding:7px 7px 7px 12px;font-family:var(--mono);font-size:13px}
.cmd span{flex:1;min-width:0;overflow-wrap:anywhere;color:var(--text)!important}
.live.mini{position:fixed;right:18px;bottom:18px;width:340px;border:1px solid var(--line-2);border-radius:var(--r-panel);box-shadow:var(--shadow);z-index:25;background:var(--surface);overflow:hidden}
.live.mini .lv-h{padding:10px 8px 8px 14px}
.live.mini .lv-body{padding:0;overflow:hidden;gap:0}
.live.mini .lv-wait{margin:0 10px 10px}
.live.mini .lv-steps,.live.mini .lv-help,.live.mini .bbar{display:none}
.live.mini .browser{box-shadow:none;border:0;border-top:1px solid var(--line);border-radius:0}

/* dialogs */
.scrim{position:fixed;inset:0;background:oklch(0.15 0.02 275 / .5);z-index:30}
.dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));max-height:calc(100% - 48px);overflow-y:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-panel);box-shadow:var(--shadow);padding:22px;z-index:31;display:grid;gap:14px}
.dialog h2{font:650 18px/1.25 var(--font);letter-spacing:-.018em}
.dh{display:flex;justify-content:space-between;align-items:center;gap:12px}
.fld{display:grid;gap:4px;font-size:12.5px;color:var(--text-2);min-width:0}
.fld input,.fld select{border:1px solid var(--line-2);background:var(--sunk);border-radius:var(--r);padding:7px 9px;font-size:14px;color:var(--text);width:100%;transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
.fld input:focus,.fld select:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.fld input::placeholder{color:var(--text-3)}
#addMsg{color:var(--i-bad)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.banner{margin:0 24px 12px;border:1px solid var(--i-warn);border-radius:var(--r);padding:8px 12px;font-size:13px;color:var(--text)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:oklch(0.26 0.02 275);border:1px solid oklch(1 0 0 / .1);color:oklch(0.96 0.005 275);padding:9px 10px 9px 16px;border-radius:var(--r-card);font-size:13px;box-shadow:var(--shadow);z-index:40;max-width:calc(100% - 24px)}
.toast button{border:0;background:oklch(1 0 0 / .14);color:inherit;border-radius:6px;padding:4px 10px;font-weight:600}
.toast button:hover{background:oklch(1 0 0 / .24)}
.emptylist{padding:72px 24px;text-align:center;color:var(--text-2);display:grid;gap:6px;justify-items:center}
.emptylist h2{font:600 17px/1.3 var(--font);letter-spacing:-.015em;color:var(--text)}
.emptylist p{max-width:44ch}
.emptylist svg.i{width:28px;height:28px;color:var(--text-3);margin-bottom:8px;stroke-width:1.3}

/* ---------- motion ---------- */
@media (prefers-reduced-motion:no-preference){
  .stamp.fresh{animation:press .34s var(--ease)}
  @keyframes press{from{transform:rotate(-9deg) scale(1.7);opacity:0;filter:blur(2px)}}
  .rcard:has(.stamp.fresh){animation:inked .7s var(--ease)}
  @keyframes inked{from{box-shadow:0 0 0 4px color-mix(in oklch,var(--i-ok) 35%,transparent)}}
  .run.running .d,.run.waiting .d{animation:blink 1.1s ease-in-out infinite alternate}
  @keyframes blink{to{opacity:.2}}
  .live[data-state="running"] .lv-dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:ping 1.6s var(--ease) infinite}
  @keyframes ping{to{transform:scale(2.8);opacity:0}}
  .lv-wait .spin{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .lv-steps li.done svg.ck path{stroke-dasharray:14;animation:draw .4s var(--ease) backwards}
  @keyframes draw{from{stroke-dashoffset:14}}
  .dialog{animation:dlgIn .22s var(--ease)}
  @keyframes dlgIn{from{opacity:0;transform:translate(-50%,-48.5%) scale(.98)}}
  .scrim{animation:fade .2s ease-out}
  .toast{animation:toastIn .26s var(--ease)}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}}
  @keyframes fade{from{opacity:0}}
  .bdone{animation:fade .4s ease-out}
  .bdone .stamp{animation:press .4s .15s var(--ease) backwards}
  /* view transitions: things move to their new place instead of swapping */
  ::view-transition-old(root),::view-transition-new(root){animation-duration:.18s;animation-timing-function:ease-out}
  ::view-transition-group(*){animation-duration:.26s;animation-timing-function:var(--ease)}
  ::view-transition-new(insp),::view-transition-new(live),::view-transition-new(sheet){animation:slideIn .3s var(--ease)}
  ::view-transition-old(insp),::view-transition-old(live),::view-transition-old(sheet){animation:slideOut .2s ease-in forwards}
  @keyframes slideIn{from{transform:translateX(36px);opacity:0}}
  @keyframes slideOut{to{transform:translateX(36px);opacity:0}}
}

/* a narrow work area (small window, or the live panel docked): the strip shows ring and count only */
@container main (max-width:960px){.pc{min-width:0;padding-inline:8px}.pc .l{flex-direction:column;align-items:flex-start;gap:4px}.rates{display:none}.vt p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
@container main (max-width:700px){.pc .l span{display:none}.bulk .prog{display:none}.bulk{gap:8px}}
@container main (max-width:460px){.bulk .txt{flex-basis:100%}.bulk .sp{display:none}}

/* the live panel takes the room a docked inspector would, so the work area behaves as on a narrow screen */
.app.withlive .vt{flex-basis:calc(100% - 240px)}
.app.withlive .run{order:0;margin-left:auto}
.app.withlive .search,.app.withlive .seg,.app.withlive #addBtn{order:1}
.app.withlive .search{flex:1 1 200px}
.app.withlive .work,.app.withlive .work.withinsp{grid-template-columns:minmax(0,1fr)}
.app.withlive .inspector.docked,.app.withlive .rates{display:none}

/* narrow screens */
@media (max-width:1280px){
  .app.withlive{grid-template-columns:240px minmax(0,1fr)}
  .live:not(.mini){position:fixed;top:10px;right:10px;bottom:10px;width:min(560px,calc(100% - 20px));border:1px solid var(--line-2);border-radius:var(--r-panel);box-shadow:var(--shadow);z-index:25;overflow:hidden}
}
@media (max-width:1180px){
  .vt{flex-basis:calc(100% - 240px)}
  .run{order:0;margin-left:auto}
  .search,.seg,#addBtn{order:1}
  .work,.work.withinsp{grid-template-columns:minmax(0,1fr)}
  .inspector.docked{display:none}
  .overview{flex-wrap:wrap;gap:0 28px}
  .pipe{flex-basis:100%}
  .rates{padding:10px 0}
}
@media (max-width:760px){
  .app,.app.withlive{grid-template-columns:minmax(0,1fr);height:auto;min-height:100dvh}
  .side{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"brand foot" "scroll scroll";gap:8px 14px;padding:10px 12px 8px;align-items:center;border-right:0;border-bottom:1px solid var(--line)}
  .brand{grid-area:brand;padding:0}.brand span,.brand .note{display:none}.brand svg.logo{width:22px;height:22px;grid-row:auto;border-radius:6px}
  .sidefoot{grid-area:foot;border:0;padding:0;display:flex;gap:12px;justify-content:flex-end}
  .sidefoot .footrow,.lim i,.lim .lg{display:none}.lim .sm{display:inline}.lim div{gap:5px;white-space:nowrap}
  .sidescroll{grid-area:scroll;flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:16px;margin:0 -12px;padding:0 12px}
  .side .navsec{display:flex;gap:2px;align-items:center}.side .navsec h3{margin:0 4px 0 0;padding:0;white-space:nowrap}
  .vt p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rates{display:none}
  .nav{white-space:nowrap;width:auto}
  .nav .lbl{overflow:visible}
  .main{display:block}
  .listpane{overflow:visible}
  .toolbar{padding:14px}
  .vt{flex-basis:calc(100% - 200px)}
  .search,.search:focus-within{flex:1 1 160px;width:auto}
  .overview{padding:0 14px}
  .pc:first-child{border-left:0}
  .cards{grid-template-columns:minmax(0,1fr);padding:12px 14px 24px}
  .bulk{padding:10px 14px;position:static}
  .thead{display:none}
  .boardpane{padding:12px 14px}
  .banner{margin-inline:14px}
  .frow{grid-template-columns:1fr}
  .live.mini{right:10px;bottom:10px;width:min(300px,calc(100% - 20px))}
}
@media (prefers-reduced-transparency:reduce){.bdone{backdrop-filter:none;background:var(--surface)}}
</style>

<body>
<script>try{const t=localStorage.getItem("od-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch{}</script>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Views"></aside>
  <main class="main">
    <header class="toolbar">
      <div class="vt"><h1 id="vTitle">Outreach Desk</h1><p id="vSub">Loading your pipeline…</p></div>
      <label class="search"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg><input id="search" type="search" placeholder="Search people" aria-label="Search people"><kbd aria-hidden="true">/</kbd></label>
      <div class="seg" role="group" aria-label="Layout">
        <button id="mList" aria-pressed="true"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4h8.5M5.5 8h8.5M5.5 12h8.5M2.2 4h.1M2.2 8h.1M2.2 12h.1"/></svg>List</button>
        <button id="mBoard" aria-pressed="false"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="3.4" height="11" rx="1"/><rect x="6.3" y="2.5" width="3.4" height="7" rx="1"/><rect x="10.6" y="2.5" width="3.4" height="9" rx="1"/></svg>Board</button>
      </div>
      <button class="btn" id="addBtn"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>Add person</button>
      <button class="run" id="runBtn" title="Send what you approved"><i class="d"></i><span id="runLabel">Nothing to run</span></button>
    </header>
    <div>
      <div class="banner" id="banner" hidden role="alert"></div>
      <section class="overview" id="overview" aria-label="Pipeline"></section>
    </div>
    <div class="work" id="work">
      <section class="listpane" id="listpane"></section>
      <section class="boardpane" id="boardpane" hidden></section>
      <aside class="inspector docked" id="inspector" aria-label="Person"></aside>
    </div>
  </main>
  <aside class="live" id="live" hidden aria-label="Live run">
    <header class="lv-h"><span class="lv-dot" aria-hidden="true"></span><div><b id="lvTitle">Live run</b><span id="lvSub" role="status"></span></div>
      <button class="iconbtn" id="lvMini" aria-label="Shrink to a small preview"></button>
      <button class="iconbtn" id="lvClose" aria-label="Close the live run"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></header>
    <div class="lv-body">
      <div class="lv-wait" id="lvWait"></div>
      <div class="browser" id="lvBrowser">
        <div class="bbar" aria-hidden="true"><i></i><i></i><i></i><span class="burl" id="lvUrl">Claude's browser</span></div>
        <div class="bview"><img id="lvImg" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="Live picture of Claude's browser working on LinkedIn" hidden><div class="bdone" id="lvDone" hidden></div></div>
      </div>
      <ol class="lv-steps" id="lvSteps" aria-label="Changes in this run"></ol>
      <div class="lv-help" id="lvHelp" hidden></div>
    </div>
  </aside>
</div>
<aside class="sheet" id="sheet" hidden aria-label="Person"></aside>
<div class="scrim" id="scrim" hidden></div>
<form class="dialog" id="addModal" hidden role="dialog" aria-modal="true" aria-labelledby="addTitle" autocomplete="off">
  <div class="dh"><h2 id="addTitle">Add a person</h2><button type="button" class="x" id="addClose" aria-label="Close"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
  <label class="fld">Name<input id="fName" required></label>
  <label class="fld">LinkedIn profile URL<input id="fUrl" type="url" placeholder="https://www.linkedin.com/in/…"></label>
  <label class="fld">Title / headline<input id="fHead"></label>
  <div class="frow"><label class="fld">Company<input id="fCo"></label><label class="fld">Country<input id="fCountry"></label></div>
  <div class="frow"><label class="fld">Group<select id="fGroup"><option value="peer">Peer</option><option value="lead">Team lead</option><option value="recruiter">Recruiter</option><option value="other">Other</option></select></label>
    <label class="fld">Status<select id="fStatus"><option value="found">To request</option><option value="requested">Request already sent</option><option value="accepted">Already connected</option></select></label></div>
  <div class="ctrl"><button class="btn primary" type="submit">Add to the desk</button><span class="fld" id="addMsg" role="alert"></span></div>
</form>
<div class="toast" id="toast" hidden role="status"><span id="toastMsg"></span><button id="toastAct" hidden></button></div>

<script>
/* ---------- constants ---------- */
const STAGES=[["found","To request"],["requested","Requested"],["accepted","Accepted"],["thanked","Thanked"],["cv_sent","CV sent"],["followed_up","Followed up"],["replied","Replied"],["done","Done"],["stale","Stale"],["blacklisted","Blacklisted"]];
const LABEL=Object.fromEntries(STAGES);
const PIPE=["found","requested","accepted","thanked","cv_sent","followed_up","replied","done","stale"];
const JOURNEY=[["requested","Requested","requestedAt"],["accepted","Accepted","acceptedAt"],["thanked","Thanked","thankedAt"],["cv_sent","CV sent","cvSentAt"],["followed_up","Followed up","followUpAt"],["replied","Replied","repliedAt"]];
const GROUPS={peer:"Peer",lead:"Team lead",recruiter:"Recruiter",other:"Other"};
const DK=["thanks","cv","followup"];
const DNAME={thanks:"Thank-you",cv:"CV message",followup:"Follow-up"};
const SENT_STATUS={thanks:["thanked","thankedAt"],cv:["cv_sent","cvSentAt"],followup:["followed_up","followUpAt"]};
const STAMP={accepted:"acceptedAt",thanked:"thankedAt",cv_sent:"cvSentAt",followed_up:"followUpAt",replied:"repliedAt",requested:"requestedAt"};
const DEFAULTS={cvDelayDays:3,followUpDays:7,closeDays:7,staleDays:21,weeklyCap:80,dailyCap:15};
const RUN_PROMPT="Run the Outreach Desk queue";
const day=864e5;
const ICONS={
  check:'<circle cx="8" cy="8" r="6.5"/><path d="M5.2 8.3l1.9 1.9 3.8-4.1"/>',
  tick:'<path d="M3.5 8.5l3 3 6-7"/>',
  send:'<path d="M14 2L2.5 6.8l4.7 2 2 4.7z"/><path d="M7.2 8.8L14 2"/>',
  clock:'<circle cx="8" cy="8" r="6.5"/><path d="M8 4.6V8l2.4 1.5"/>',
  bubble:'<path d="M3 3h10a1.2 1.2 0 011.2 1.2v6A1.2 1.2 0 0113 11.4H7.2L4 14v-2.6H3a1.2 1.2 0 01-1.2-1.2v-6A1.2 1.2 0 013 3z"/>',
  hourglass:'<path d="M4 2h8M4 14h8M5 2v1.6c0 1.6 3 2.9 3 4.4s-3 2.8-3 4.4V14M11 2v1.6c0 1.6-3 2.9-3 4.4s3 2.8 3 4.4V14"/>',
  people:'<circle cx="6" cy="5.4" r="2.5"/><path d="M1.6 13.6c.6-2.4 2.3-3.6 4.4-3.6s3.8 1.2 4.4 3.6"/><path d="M10.6 3.1a2.4 2.4 0 010 4.6M12.1 10.2c1.2.5 2 1.6 2.4 3.3"/>',
  block:'<circle cx="8" cy="8" r="6.5"/><path d="M3.4 12.6l9.2-9.2"/>',
  out:'<path d="M6.5 3.5H3.5v9h9v-3"/><path d="M9 2.5h4.5V7M13.5 2.5L7.5 8.5"/>',
  copy:'<rect x="5.2" y="5.2" width="8.3" height="8.3" rx="1.6"/><path d="M3 10.6V3.6A1.1 1.1 0 014.1 2.5h7"/>',
  x:'<path d="M4 4l8 8M12 4l-8 8"/>',
  sun:'<circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/>',
  moon:'<path d="M13.5 9.6A5.8 5.8 0 016.4 2.5a5.8 5.8 0 107.1 7.1z"/>',
  auto:'<rect x="2" y="3" width="12" height="8" rx="1.5"/><path d="M6 13.5h4"/>',
  shrink:'<path d="M9.5 2.5v4h4M6.5 13.5v-4h-4M13.5 2.5l-4 4M2.5 13.5l4-4"/>',
  expand:'<path d="M9.5 2.5h4v4M6.5 13.5h-4v-4M13.5 2.5L9 7M2.5 13.5L7 9"/>',
  live:'<rect x="1.8" y="3" width="12.4" height="9" rx="1.8"/><path d="M6.8 5.8v3.4l3-1.7z"/>',
  globe:'<circle cx="8" cy="8" r="6.5"/><path d="M1.5 8h13M8 1.5c1.8 1.9 2.6 4 2.6 6.5S9.8 12.6 8 14.5C6.2 12.6 5.4 10.5 5.4 8S6.2 3.4 8 1.5z"/>'
};
const ic=(n,cls="i")=>`<svg class="${cls}" viewBox="0 0 16 16" aria-hidden="true">${ICONS[n]||""}</svg>`;

/* ---------- state ---------- */
let contacts=[], settings={...DEFAULTS}, meta={}, runReq={}, loaded=false;
let view=null, country="all", query="", selId=null, mode="list", inspOpen=false;
try{ view=localStorage.getItem("od-view")||null; mode=localStorage.getItem("od-mode")||"list"; country=localStorage.getItem("od-country")||"all"; }catch{}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const t=d=>d?new Date(d).getTime():NaN;
const fmt=d=>{const x=new Date(d);return isNaN(x)?"":x.toLocaleDateString(undefined,{day:"numeric",month:"short"});};
function rel(ms,past){ if(isNaN(ms)) return ""; const d=Math.round((ms-Date.now())/day);
  if(past) return d>=0?"today":(d===-1?"yesterday":`${-d} days ago`);
  return d===0?"today":d>0?`in ${d}d`:`${-d}d overdue`; }
const save=(k,v)=>{try{localStorage.setItem(k,v);}catch{}};
const initials=n=>String(n||"?").replace(/^dr\.?\s+/i,"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();

/* ---------- derived ---------- */
function stageOf(c){ if(c.status==="requested" && t(c.requestedAt)+settings.staleDays*day<Date.now()) return "stale"; return c.status||"found"; }
const drafts=c=>c.drafts||{};
const pendingKeys=c=>DK.filter(k=>drafts(c)[k] && !drafts(c)[k].sentAt && !drafts(c)[k].approved);
const approvedKeys=c=>DK.filter(k=>drafts(c)[k] && !drafts(c)[k].sentAt && drafts(c)[k].approved);
const openKeys=c=>DK.filter(k=>drafts(c)[k] && !drafts(c)[k].sentAt);
function recentlyDone(c){ const lim=Date.now()-day; return DK.some(k=>t(drafts(c)[k]?.sentAt)>lim) || t(c.withdrawnAt)>lim; }
function rowState(c){
  if(c.withdrawPending) return "queued";
  if(approvedKeys(c).length && !pendingKeys(c).length) return "approved";
  if(pendingKeys(c).some(k=>drafts(c)[k].editedByUser)) return "edited";
  if(recentlyDone(c)) return "sent";
  return "";
}
function stateChip(c){
  const s=rowState(c), p=pendingKeys(c).length;
  if(s==="queued") return `<span class="stamp seal flat s-bad">Withdraw queued</span>`;
  if(s==="approved") return `<span class="stamp seal flat s-ok">Approved</span>`;
  if(s==="edited") return `<span class="stamp s-edit">Edited</span>`;
  if(p) return `<span class="stamp s-need">Needs OK</span>`;
  if(s==="sent") return `<span class="stamp s-sent">Sent</span>`;
  return "";
}
function nextStep(c){
  const s=settings, now=Date.now(), d=drafts(c);
  const draftStep=(k,label,due)=> d[k]&&!d[k].sentAt ? (d[k].approved?{text:`${label} queued for Claude`,due,passive:true,tone:"ok"}:{text:`Approve the ${label==="CV message"?label:label.toLowerCase()}`,due,tone:"warn"}) : {text:`${label} to write`,due,tone:"info"};
  switch(stageOf(c)){
    case "found": return {text:"Send connection request",due:now,tone:"info"};
    case "requested": return {text:"Waiting for acceptance",due:t(c.requestedAt)+s.staleDays*day,passive:true,tone:"idle"};
    case "stale": return c.withdrawPending?{text:"Withdrawal queued",passive:true,due:now,tone:"bad"}:{text:"Withdraw and blacklist",due:t(c.requestedAt)+s.staleDays*day,tone:"bad"};
    case "accepted": return draftStep("thanks","Thank-you",t(c.acceptedAt)||now);
    case "thanked": return draftStep("cv","CV message",t(c.thankedAt)+s.cvDelayDays*day);
    case "cv_sent": return d.followup&&!d.followup.sentAt?draftStep("followup","Follow-up",t(c.cvSentAt)+s.followUpDays*day):{text:"Follow up if no reply",due:t(c.cvSentAt)+s.followUpDays*day,tone:"info"};
    case "followed_up": return {text:"Close if no reply",due:t(c.followUpAt)+s.closeDays*day,tone:"idle"};
    case "replied": return {text:"Answer the reply",due:t(c.repliedAt)||now,tone:"ok",past:true};
    default: return null;
  }
}
const isDue=c=>{const n=nextStep(c); return n&&!n.passive&&n.due<=Date.now()+day;};
const VIEWS={
  needs:{title:"Review drafts",icon:"check",test:c=>c.status!=="blacklisted"&&openKeys(c).length>0,hint:"Approved drafts get a stamp and stay in place"},
  ready:{title:"Ready to send",icon:"send",all:true,test:c=>(c.status!=="blacklisted"&&approvedKeys(c).length>0)||c.withdrawPending,hint:"Approved. Press Run changes to send"},
  due:{title:"Due",icon:"clock",test:isDue,hint:"Everything that needs doing today"},
  replies:{title:"Replies",icon:"bubble",test:c=>c.status==="replied",hint:"Answer these yourself"},
  stale:{title:"Stale invites",icon:"hourglass",test:c=>stageOf(c)==="stale"&&!c.withdrawPending,hint:"No answer for 21+ days"},
  all:{title:"Everyone",icon:"people",test:()=>true,hint:"All people on the desk"},
  blacklist:{title:"Blacklist",icon:"block",all:true,test:c=>c.status==="blacklisted",hint:"Never contacted again"}

/* ---------- writes ---------- */
async function post(id,patch,event){
  const r=await fetch("/api/contacts/"+encodeURIComponent(id),{method:"POST",headers:{"Content-Type":"application/json","X-Outreach-Desk":"1"},body:JSON.stringify({patch,event,by:"You"})});
  if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error||r.status);
}
async function write(c,patch,event,msg){
  try{ await post(c.id,patch,event); if(msg!==false) toast(msg||event||"Saved"); await poll(true); }
  catch{ toast("Could not save. Is the Outreach Desk server running?"); }
}
const textOf=(id,k)=>document.querySelector(`textarea[data-draft="${k}"][data-id="${CSS.escape(id)}"]`)?.value;
async function setApproved(c,k,on){
  const text=textOf(c.id,k)??drafts(c)[k].text;
  const patch={drafts:{[k]:{approved:on,text}}}; if(text!==drafts(c)[k].text) patch.drafts[k].editedByUser=true;
  if(on) fresh.add(c.id+":"+k);
  await write(c,patch,on?`Approved ${DNAME[k].toLowerCase()}`:`Unapproved ${DNAME[k].toLowerCase()}`,false);
}
async function bulkApprove(on){
  const pool=contacts.filter(c=>inCountry(c)&&c.status!=="blacklisted");
  const jobs=[]; pool.forEach(c=>(on?pendingKeys(c):approvedKeys(c)).forEach(k=>jobs.push([c,k])));
  if(!jobs.length) return;
  let done=0;
  for(const [c,k] of jobs){ const text=textOf(c.id,k)??drafts(c)[k].text; if(on) fresh.add(c.id+":"+k);
    try{ await post(c.id,{drafts:{[k]:{approved:on,text}}},on?`Approved ${DNAME[k].toLowerCase()}`:`Unapproved ${DNAME[k].toLowerCase()}`); done++; }catch{} }
  await poll(true);
  toast(`${on?"Approved":"Unapproved"} ${done} draft${done===1?"":"s"}`, on?{label:"Undo",fn:()=>undoApprove(jobs)}:null);
}
async function undoApprove(jobs){ for(const [c,k] of jobs){ try{ await post(c.id,{drafts:{[k]:{approved:false}}},`Unapproved ${DNAME[k].toLowerCase()}`);}catch{} } await poll(true); toast("Undone"); }
async function blacklist(c){
  const pending=["requested","stale"].includes(c.status)||stageOf(c)==="stale";
  const overdue=t(c.requestedAt)+settings.staleDays*day<Date.now();
  return post(c.id,{status:"blacklisted",prevStatus:c.status,blacklistedAt:new Date().toISOString(),
    blacklistReason:pending&&overdue?`No answer in ${settings.staleDays} days`:"Your choice",withdrawPending:pending},
    pending?"Blacklisted, invite withdrawal queued":"Blacklisted");
}
function arm(b,label){ if(b.dataset.armed==="1") return true; b.dataset.armed="1"; const old=b.innerHTML; b.textContent=label||"Click again to confirm";
  setTimeout(()=>{ if(b.isConnected){ b.dataset.armed="0"; b.innerHTML=old; } },3500); return false; }

function slugFor(url,name){ const m=(url||"").match(/linkedin\.com\/in\/([^/?#]+)/i);
  let s=m?decodeURIComponent(m[1]):(name+"-"+Date.now().toString(36));
  return s.normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9_-]+/g,"-").replace(/^-+|-+$/g,"").toLowerCase().slice(0,120); }

  try{ const id=slugFor(url,name); const r=await fetch("/api/contacts",{method:"POST",headers:{"Content-Type":"application/json","X-Outreach-Desk":"1"},body:JSON.stringify({id,contact})});
    const d=await r.json().catch(()=>({})); if(!r.ok){ $("addMsg").textContent=d.error||"Could not add"; return; }

  }catch{ $("addMsg").textContent="The server isn't answering"; }

let rev=-1, failed=0;
async function poll(force){
  try{ const r=await fetch("/api/state"+(force||rev<0?"":"?rev="+rev),{cache:"no-store"});
    if(r.status===200){ const d=await r.json(); rev=d.rev; contacts=d.contacts; settings={...DEFAULTS,...(d.meta?.settings||{})}; meta=d.meta?.run||{}; runReq=d.meta?.runRequest||{}; loaded=true;
      if(selId&&!contacts.some(c=>c.id===selId)) selId=null; render(); }
    failed=0; $("banner").hidden=true;
  }catch{ if(++failed>=2){ $("banner").hidden=false; $("banner").textContent="The Outreach Desk server isn't answering. Ask Claude to open the Outreach Desk, or run: python3 app/launch.py"; } }
}
poll(true);
/* poll faster while a run is waiting or in progress, so the checklist keeps up with Claude */
(function tick(){ setTimeout(async()=>{ if(!document.hidden) await poll(false); tick(); }, ["requested","running"].includes(runReq.status)?1000:4000); })();
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) poll(false); });
</script>
</body>
