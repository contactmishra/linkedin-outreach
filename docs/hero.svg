<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
  <title id="t">LinkedIn Outreach for Claude Code</title>
  <desc id="d">Turn LinkedIn into referrals. Claude finds the people, writes the messages and keeps the books. You approve every word.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2620"/>
      <stop offset="1" stop-color="#1B5C4B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34C759" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7FE0BE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  </style>

  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="24" fill="url(#dots)"/>

  <!-- left: message -->
  <text x="64" y="92" class="f" font-size="15" font-weight="600" letter-spacing="2.5" fill="#8FD9BF">JOB SEARCH · CLAUDE CODE SKILL</text>
  <text x="62" y="160" class="f" font-size="58" font-weight="800" fill="#FFFFFF">LinkedIn Outreach</text>
  <text x="64" y="212" class="f" font-size="24" font-weight="600" fill="#CFEFE3">Turn LinkedIn into referrals.</text>
  <text x="64" y="250" class="f" font-size="18" fill="#B4CFC6">Claude finds the people, writes the messages</text>
  <text x="64" y="276" class="f" font-size="18" fill="#B4CFC6">and keeps the books. You approve every word.</text>

  <g class="f" font-size="14" font-weight="600">
    <rect x="64" y="318" width="196" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <circle cx="84" cy="336" r="4" fill="#7FE0BE"/>
    <text x="96" y="341" fill="#FFFFFF">Runs on your computer</text>
    <rect x="272" y="318" width="246" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <circle cx="292" cy="336" r="4" fill="#7FE0BE"/>
    <text x="304" y="341" fill="#FFFFFF">Nothing sent without your OK</text>
    <rect x="530" y="318" width="124" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <circle cx="550" cy="336" r="4" fill="#7FE0BE"/>
    <text x="562" y="341" fill="#FFFFFF">Free · MIT</text>
  </g>

  <!-- right: mini dashboard -->
  <g filter="url(#shadow)">
    <rect x="744" y="56" width="472" height="328" rx="18" fill="#F7F9F8"/>
  </g>
  <g class="f">
    <text x="772" y="96" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5B6B65">OUTREACH DESK</text>
    <text x="772" y="124" font-size="22" font-weight="800" fill="#15211D">Review drafts</text>

    <!-- run changes button with glow -->
    <ellipse cx="1124" cy="112" rx="96" ry="40" fill="url(#glow)"/>
    <rect x="1048" y="94" width="148" height="36" rx="18" fill="#34C759"/>
    <circle cx="1068" cy="112" r="4" fill="#FFFFFF"/>
    <text x="1080" y="117" font-size="14" font-weight="700" fill="#FFFFFF">Run 3 changes</text>

    <!-- pipeline: one bar, one colour per stage -->
    <g>
      <rect x="772" y="148" width="132" height="12" rx="3" fill="#007AFF"/>
      <rect x="906" y="148" width="96" height="12" rx="3" fill="#FF9500"/>
      <rect x="1004" y="148" width="44" height="12" rx="3" fill="#30B0C7"/>
      <rect x="1050" y="148" width="40" height="12" rx="3" fill="#5856D6"/>
      <rect x="1092" y="148" width="28" height="12" rx="3" fill="#AF52DE"/>
      <rect x="1122" y="148" width="34" height="12" rx="3" fill="#34C759"/>
      <rect x="1158" y="148" width="30" height="12" rx="3" fill="#FF3B30"/>
    </g>
    <g font-size="11.5" fill="#5E5E63">
      <circle cx="776" cy="180" r="4" fill="#007AFF"/><text x="785" y="184">Requested</text>
      <circle cx="853" cy="180" r="4" fill="#FF9500"/><text x="862" y="184">Accepted</text>
      <circle cx="925" cy="180" r="4" fill="#30B0C7"/><text x="934" y="184">Thanked</text>
      <circle cx="994" cy="180" r="4" fill="#5856D6"/><text x="1003" y="184">CV sent</text>
      <circle cx="1059" cy="180" r="4" fill="#34C759"/><text x="1068" y="184">Replied</text>
      <circle cx="1124" cy="180" r="4" fill="#FF3B30"/><text x="1133" y="184">Stale</text>
    </g>

    <!-- approval progress -->
    <text x="772" y="214" font-size="12.5" fill="#1D1D1F"><tspan font-weight="700">3 of 7</tspan><tspan fill="#5E5E63"> drafts approved</tspan></text>
    <rect x="918" y="205" width="162" height="6" rx="3" fill="#E5E5EA"/>
    <rect x="918" y="205" width="69" height="6" rx="3" fill="#34C759"/>
    <rect x="1094" y="196" width="94" height="26" rx="7" fill="#007AFF"/>
    <text x="1141" y="213" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">Approve all 4</text>

    <!-- review cards: approved = green, waiting = white -->
    <rect x="772" y="236" width="204" height="128" rx="10" fill="#E3F6E8" stroke="#8FDCA3"/>
    <rect x="772" y="248" width="3" height="104" rx="1.5" fill="#FF9500"/>
    <circle cx="796" cy="262" r="12" fill="#FF9500"/><text x="796" y="266" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">AK</text>
    <text x="815" y="260" font-size="12.5" font-weight="700" fill="#1D1D1F">Anna Keller</text>
    <text x="815" y="275" font-size="10.5" fill="#5E5E63">Detection Engineer</text>
    <text x="786" y="298" font-size="11" fill="#1D1D1F">Hi Anna, we both build SIEM</text>
    <text x="786" y="313" font-size="11" fill="#1D1D1F">detections for energy grids…</text>
    <rect x="874" y="331" width="90" height="22" rx="6" fill="#D2F0DA" stroke="#8FDCA3"/>
    <text x="919" y="346" font-size="11" font-weight="700" text-anchor="middle" fill="#1D7A34">✓ Approved</text>

    <rect x="984" y="236" width="204" height="128" rx="10" fill="#FFFFFF" stroke="#D5D5DA"/>
    <rect x="984" y="248" width="3" height="104" rx="1.5" fill="#FF9500"/>
    <circle cx="1008" cy="262" r="12" fill="#FF9500"/><text x="1008" y="266" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">HD</text>
    <text x="1027" y="260" font-size="12.5" font-weight="700" fill="#1D1D1F">Henrik Dahl</text>
    <text x="1027" y="275" font-size="10.5" fill="#5E5E63">Head of Security Ops</text>
    <text x="998" y="298" font-size="11" fill="#1D1D1F">Hi Henrik, we both moved</text>
    <text x="998" y="313" font-size="11" fill="#1D1D1F">from OT monitoring into…</text>
    <rect x="1108" y="331" width="68" height="22" rx="6" fill="#007AFF"/>
    <text x="1142" y="346" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">Approve</text>
  </g>
</svg>
